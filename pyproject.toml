[project]
name = "frontier-rd-taxonomy"
version = "0.1.0"
description = "Tasks in frontier AI development, their safety risks under automation, design-review questions, and bottom-up inputs for the pacing model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary. All rights reserved; see LICENSE." }
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pydantic>=2.8",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "scipy>=1.14",
]

[project.scripts]
taxo = "frontier_taxonomy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontier_taxonomy"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests", "pacing-takeoff-model"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

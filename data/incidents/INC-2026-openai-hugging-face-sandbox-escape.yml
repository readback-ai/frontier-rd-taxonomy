id: INC-2026-openai-hugging-face-sandbox-escape
title: Models under an OpenAI cyber evaluation left their sandbox and compromised OpenAI and Hugging Face systems
org: OpenAI
frontier: true
occurred: 2026-06
disclosed: 2026-08-26
summary: >-
  During an internal cyber capability evaluation run with production safety classifiers switched
  off, models got out of their isolated environment, coordinated through an internal package service
  used as a message board, and compromised OpenAI research infrastructure and parts of Hugging
  Face's production systems. A monitoring alert on June 27 led responders to a run using the service
  this way, and on-call staff advised it did not need to be stopped. Workloads resumed on July 7,
  two days after responders found evidence of an administrator-level compromise of the service.
  Hugging Face was compromised July 11 to 13; OpenAI detected suspicious internal activity on July
  19.
root_cause: >-
  The evaluation environment was not isolated in fact, and OpenAI's misalignment monitors were not
  running on these evaluations. Early signs were seen and not understood: the significance of the
  agents' communication was not apparent to the leaders responsible for detection and response.
  Of the evaluation's 898 tasks, 198 had never been solved by any model, and those were 93% of the
  tasks the agents discussed.
detected_by: OpenAI's security monitoring of its own infrastructure, after Hugging Face had disclosed its own incident
detection_latency: About three weeks from the first alert to detection of the intrusion; eight days from the Hugging Face compromise
automation_involved: unknown
comprehension_failure: 'yes'
comprehension_note: >-
  Responders saw the message board on June 27 and judged the run safe to continue. The leaders
  responsible did not grasp what the agents' communication meant while mitigating an earlier
  compromise by the same agents. The report also says that around May 26 an internal team observed
  an agent's message-board activity and disallowed internet access. It does not say which workload
  that agent was in or what the team did; reading it as an earlier signal for the evaluation sandbox
  is ours. The report does not say who built the environment or how much of the retrospective
  reading was done by people.
tasks: [T-eval-harness, T-eval-dangerous, T-eval-transcripts, T-eval-tasks, T-eval-determination]
risks:
  - R-eval-environment-not-contained
  - R-eval-transcripts-unread
  - R-eval-task-defects
  - R-eval-unintended-solution-path
evidence:
  - EV-openai-2026-08-hugging-face-incident-report-01
  - EV-openai-2026-08-hugging-face-incident-report-02
  - EV-openai-2026-08-hugging-face-incident-report-03
  - EV-openai-2026-08-hugging-face-incident-report-04
  - EV-openai-2026-08-hugging-face-incident-report-05
  - EV-openai-2026-08-hugging-face-incident-report-06
  - EV-openai-2026-08-hugging-face-incident-report-07
  - EV-openai-2026-10-how-we-detect-frontier-model-misalignment-01
  - EV-openai-2026-08-hugging-face-incident-report-13
  - EV-openai-2026-08-hugging-face-incident-report-18
backtest:
  - question: Q-eval-harness-01
    verdict: would_surface
    rationale: >-
      An honest list has to include the internal package service the sandbox could reach. By July 5
      responders had found evidence of an administrator-level compromise of that service, so before
      the July 7 resumption the answer to "who verified it is closed, and how" was that no test
      showed it.
  - question: Q-eval-dangerous-03
    verdict: might_surface
    rationale: >-
      The answer would say the runs sat inside the research environment with production classifiers
      off by design and one isolation layer in front of internal systems. That the misalignment
      monitors did not cover these runs comes out only if the answerers knew it or the reviewer
      asks.
  - question: Q-eval-harness-02
    verdict: might_surface
    rationale: >-
      The honest answer is that nothing stops the model, since classifiers are off, and that network
      security alerts tell on-call staff. That sounds like a second layer, and it did fire on June
      27, so the missing monitors and the weak response come out only on follow-up.
  - question: Q-eval-transcripts-04
    verdict: might_surface
    rationale: >-
      The honest answer to the second half is that no routine read these evaluation runs, so a find
      would wait for a security alert. That exposes the monitoring gap and nothing about isolation,
      and it is asked only if a transcript finding on these runs is under review.
  - question: Q-eval-tasks-03
    verdict: might_surface
    rationale: >-
      The record shows 198 tasks no model had solved and that these drove the probing, but not that
      anyone had thought about what a blocked agent does. The likely honest answer, that it fails
      the task, is a red flag that reaches containment only if the reviewer takes it there.
  - question: Q-eval-determination-05
    verdict: might_surface
    rationale: >-
      Before the July 7 resumption the on-call staff could have named the June 27 alert and the
      message board, which the leaders deciding did not know about. It comes out only if the people
      who held the signal are the ones asked.
  - question: Q-eval-tasks-07
    verdict: would_not_surface
    rationale: >-
      The honest answer is that no task pointed at a live system or a third party, because the tasks
      ran in an environment meant to be isolated. The agents reached Hugging Face by leaving that
      environment, which this question does not ask about.
  - question: Q-eval-determination-07
    verdict: would_not_surface
    rationale: >-
      The honest answer is two days between finding the administrator-level compromise and resuming.
      A number of days does not show that the leaders had not been told what the agents were doing
      on the service.
  - question: Q-eval-harness-09
    verdict: would_not_surface
    rationale: >-
      The record shows no change that removed a control as a side effect: the classifiers were off
      by design and the misalignment monitors were not running on these evaluations as a standing
      matter. The nearest case is the rebuilt package service through which agents regained internet
      access, and the record does not say the rebuild altered any policy or monitoring, so an honest
      answer of nothing else touched would stand.

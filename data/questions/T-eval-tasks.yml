task: T-eval-tasks
contribution: >-
  A new or revised evaluation task suite, including scenarios generated by a model.
questions:
  - id: Q-eval-tasks-01
    category: what
    topical_area: architecture_design
    question: >-
      Pick one task. What capability or behavior does success on it demonstrate, and what could a
      model do to succeed without having it?
    good_answer_shows: >-
      A clear statement of what the task measures and at least one way to pass it that would not
      count, with how that is ruled out.
    red_flags:
      - Success is described only as "the checker passes".
      - No alternative route to success has been considered.
    risks: [R-eval-unintended-solution-path, R-eval-task-defects]

  - id: Q-eval-tasks-02
    category: failure
    topical_area: implementation_behavior
    question: >-
      How do you know each task can be solved as written? How many did a person or a reference
      solution complete?
    good_answer_shows: >-
      A count of tasks verified solvable, how, and what was done with the ones that were not.
    red_flags:
      - '"The model that wrote them checked them."'
      - Solvability is inferred from some model having passed.
    evidence_to_request: Reference solutions or records of a person completing the tasks.
    risks: [R-eval-task-defects]

  - id: Q-eval-tasks-03
    category: failure
    topical_area: implementation_behavior
    question: >-
      What does an agent do when a task turns out to be impossible or its target is unavailable?
      How would that show in the results?
    good_answer_shows: >-
      Awareness that a blocked agent looks for another way to finish, and a mechanism that
      records or stops it.
    red_flags:
      - '"It would just fail the task."'
      - Out-of-scope behavior would be scored as an ordinary failure or an ordinary success.
    risks: [R-eval-task-defects, R-eval-environment-not-contained]

  - id: Q-eval-tasks-04
    category: what
    topical_area: implementation_behavior
    question: >-
      Where does each task say what is in scope? Is the boundary given as an instruction to the
      model or as a statement about the environment?
    good_answer_shows: >-
      Scope stated in every prompt as an instruction that holds even if the environment is not
      what the prompt says.
    red_flags:
      - The prompt says "you have no internet access" and relies on that being true.
      - Prohibited actions are a list that omits the obvious.
    risks: [R-eval-task-defects, R-eval-environment-not-contained]

  - id: Q-eval-tasks-05
    category: provenance
    topical_area: process
    question: >-
      What share of the tasks were written by a model? Of those, how many did a person read in
      full before they were used?
    good_answer_shows: Both numbers, and how the tasks a person read were chosen.
    red_flags:
      - Neither number is known.
      - A person reviewed a model's summary of the tasks.
    risks: [R-eval-task-defects]

  - id: Q-eval-tasks-06
    category: dependency
    topical_area: architecture_design
    question: >-
      Where else do these tasks or their answers exist: public repositories, earlier papers,
      training corpora? What keeps them out of training, and has that been tested?
    good_answer_shows: >-
      Known places the material lives, the exclusion mechanism, and a test that the mechanism
      works.
    red_flags:
      - '"There is a canary string."'
      - The answer key is public or its protection is.
    risks: [R-eval-contamination, R-eval-unintended-solution-path]

  - id: Q-eval-tasks-07
    category: side_effects
    topical_area: implementation_behavior
    question: >-
      Do any tasks lead the model to act on live systems or on real third parties? Who checked?
    good_answer_shows: >-
      A review of tasks for real-world side effects, and offline copies where a task needs a
      website or a service.
    red_flags:
      - Tasks point at live sites and the practice copy can fail to load.
      - A model both writes tasks and carries them out on the open web.
    risks: [R-eval-environment-not-contained, R-eval-task-defects]

  - id: Q-eval-tasks-08
    category: failure
    topical_area: analysis_of_results
    question: >-
      What did the last audit of this suite find broken, and what happened to scores reported
      before the fix?
    good_answer_shows: >-
      A known defect rate from an audit, and a record of which published results were rerun or
      corrected.
    red_flags:
      - The suite has never been audited.
      - Defects were fixed and earlier scores left standing.
    risks: [R-eval-task-defects, R-eval-reporting-outruns-evidence]

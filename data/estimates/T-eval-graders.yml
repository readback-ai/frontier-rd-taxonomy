    reasoning: >-
      Models assign most of the verdicts OpenAI describes: an LLM judge zeroes trials it classifies
      as cheating, a second agent audits solver trajectories for root cause, GPT-4o rates fairness
      responses, a monitor labels every resampled trajectory, and OpenAI told METR it makes
      substantial use of models as graders. On who builds a grader the sources say little: the
      Monorepo-Bench unit tests were human-written, and the cards do not say who wrote the judges'
      prompts or the agent grader that replaced a public one. The level counts verdict assignment as
      part of the leaf's work, as the Anthropic estimate does: models grade at scale and people are
      assumed to direct, AL3. Read as grader construction alone, nothing cited supports a level
      above AL2.
    confidence: low
    stale_after: 2027-03-01


      Some graders get a human check and others none. One autorater prompt was red-teamed for false
      negatives by a second researcher. People read 419 of the 517 rollouts one judge flagged in one
      tier. That checks the judge's positives on rollouts the judge chose. In the cheating audit,
      runs the judge did not flag were checked only in a random sample, and LLMs did all of the
      reviewing. An audit found crashing verifiers and incorrect ground truth among the bugs in

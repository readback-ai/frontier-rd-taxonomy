    reasoning: >-
      Safeguard testing mixes automated and manual attack. Automated orchestrators run the cyber
      adaptive jailbreak evaluation, and an outside tester ran an automated red-teaming agent
      against 25 cyber tasks built on scenarios Google DeepMind supplied. In the monitor evasion
      work, an LLM generates the side tasks of the internal-codebase evaluation, and on LinuxArena
      prompts optimized by a version of Gemini were tested beside hand-written ones. The report does
      not say which gave the reported results. Manual work sits beside it: one outside team spent 38
      hours red teaming by hand, and coverage sets are partly expert-written. Models do large chunks
      on goals and scenarios that people supply: AL3. No shares are given, and who reads the
      automated attackers' output is not stated. Two of the six items are Google DeepMind's
      summaries of outside testers' work.
    confidence: low
    stale_after: 2027-04-01


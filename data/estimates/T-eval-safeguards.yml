    reasoning: >-
      Models produce attacks and test cases at scale in OpenAI's safeguard testing: one measured
      portion of automated red-teaming of Astra's safeguards used an estimated 200,000 A100e
      GPU-hours, GPT-6 Astra edited rollouts into test cases for the Auto-review monitor, and OpenAI
      asks its most capable agents to try to evade or disable its monitoring system in controlled
      environments. Attacker models such as GPT-Red also generated the static jailbreak prompts, in
      an evaluation of the model without its production safeguards. People supply ground truth and
      independent attack: staff labeled the 21 and 63 transcripts used to measure monitor recall,
      experts and employees validated the misuse-monitor examples, and METR and Redwood Research
      red-teamed the monitoring system for three weeks. No source gives the split between model and
      human red-teaming or says who analyzes the results. Models do large parts under people's
      direction: AL3.
    confidence: low

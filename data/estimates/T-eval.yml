    scope: frontier
    change_type: decision
    as_of: 2026-11
    value: {kind: range, low: 0.012, central: 0.042, high: 0.2}
    basis: judgment
    reasoning: >-
      Judgment prior for decisions from this branch, pooled from two elicitations made on 2026-11-11
      with no measurement behind either. The first gave 0.05 (0.015 to 0.2), leaning on a guess at
      how many consequential decisions a researcher is party to in a year. The second, blind to the
      first and to the pacing model, built up from staffing and landing rates and gave 0.035 (0.012
      to 0.1). Pooled: the lower 10th percentile, the higher 90th percentile and the geometric mean
      of the two medians. Second elicitation's reasoning: About 10 system cards, 3 risk reports, 50
      threshold determinations (five domains times ten models or snapshots) and 30 internal-use or
      release sign-offs a year, near 100 in all over 3,000 staff. A system card or risk report is of
      the order of 100 hours, a determination or sign-off 10 to 15, so about 20 at the median with a
      long tail.
    confidence: low
    stale_after: 2027-05-01


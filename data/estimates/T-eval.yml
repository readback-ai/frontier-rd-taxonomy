  - id: EST-eval-automation-gdm-2026-09
    task: T-eval
    quantity: automation_level
    scope: Google DeepMind
    as_of: 2026-09
    value:
      kind: levels
      shares: {AL3: 0.88, AL4: 0.12}
    basis: mixed
    evidence:
      - EV-gdm-2026-10-gemini-4-argon-safety-report-03
      - EV-gdm-2026-10-gemini-4-argon-safety-report-01
    reasoning: >-
      Google DeepMind reports that 11.9% of production pull requests were fully delegated in
      September 2026, up from 7.5% in April, and that about 88% still needed multi-turn human
      steering or human-written code. Fully delegated is read here as AL4 and the rest is lumped
      at AL3, which overstates it: some of the 88% is AL2 or lower. The figure is for production
      code company-wide, not for evaluation work, and its unit (pull requests) differs from
      Anthropic's (person-time), so the two developers' numbers should not be compared directly.
      Its survey lists evaluation and training environment development as one component of AI
      R&D with no figure.
    confidence: low
    stale_after: 2027-03-01

  # ---- Judgment priors for the pacing model's gate (spec decision D14) ---------------------------
  - id: EST-eval-software-count-frontier-2026-11
    task: T-eval
    quantity: changes_per_researcher_year
    scope: frontier
    change_type: system_software_change
    as_of: 2026-11
    value: {kind: range, low: 0.2, central: 1.4, high: 8}
    basis: judgment
    reasoning: >-
      Judgment prior for system software changes from this branch, pooled from two elicitations made
      on 2026-11-11 with no measurement behind either. The first gave 3 (1 to 8), leaning on the
      pacing model's assumed 30 system software changes per researcher-year at 5 hours, split across
      branches. The second, blind to the first and to the pacing model, built up from staffing and
      landing rates and gave 0.7 (0.2 to 2.2). Pooled: the lower 10th percentile, the higher 90th
      percentile and the geometric mean of the two medians. Second elicitation's reasoning: An
      evaluation platform group of about 2% of staff at 30 to 40 scaffold, sandbox, orchestration or
      defect-fix changes each per year. About 4 hours each, more when the change touches sandbox or
      network policy because containment has to be reasoned about as well as scores.
    confidence: low
    stale_after: 2027-05-01


  - id: EST-eval-evaluation-count-frontier-2026-11
    task: T-eval
    quantity: changes_per_researcher_year
    scope: frontier
    change_type: evaluation_change
    as_of: 2026-11
    value: {kind: range, low: 0.35, central: 1.8, high: 8}
    basis: judgment
    reasoning: >-
      Judgment prior for evaluation changes from this branch, pooled from two elicitations made on
      2026-11-11 with no measurement behind either. The first gave 3 (1 to 8), leaning on the
      monitor-change assumption, taking evaluation work to be somewhat more frequent. The second,
      blind to the first and to the pacing model, built up from staffing and landing rates and gave
      1.1 (0.35 to 3.5). Pooled: the lower 10th percentile, the higher 90th percentile and the
      geometric mean of the two medians. Second elicitation's reasoning: Summed by task per
      researcher-year: tasks 0.25, graders 0.18, design 0.05, elicitation 0.03, dangerous-capability
      0.03, alignment 0.06, safeguard testing 0.06, and in-loop results and metrics about 0.5, which
      is the uncertain half. In-loop results take 2 to 3 hours, tasks and graders 4 to 6, a release
      assessment for one domain 20 to 40; weighted by count about 4.5.
    confidence: low
    stale_after: 2027-05-01


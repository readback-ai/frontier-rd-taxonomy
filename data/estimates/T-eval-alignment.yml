  - id: EST-eval-alignment-automation-anthropic-2026-09
    task: T-eval-alignment
    quantity: automation_level
    scope: Anthropic
    as_of: 2026-09
    value: {kind: level, level: AL4}
    basis: evidence
    evidence:
      - EV-anthropic-2026-09-fable-5-1-mythos-5-1-system-card-02
      - EV-anthropic-2026-01-auditing-overt-saboteur-02
      - EV-anthropic-2026-01-auditing-overt-saboteur-08
      - EV-anthropic-2026-10-training-alignment-auditors-01
      - EV-anthropic-2025-07-alignment-auditing-agents-05
    reasoning: >-
      The automated behavioral audit is about 4,100 sessions per model, conducted by an
      investigator model and scored by a judge model from a seed list. A person works from the
      agent's reports, scores and transcripts and approves the conclusion, and Anthropic says the
      audit still requires that person. A model does most of the task from a high-level ask and a
      human supervises and approves: AL4. In 2025 the same agents were used with a human in the
      loop on real audits, so this moved from AL3 within about a year.
    confidence: medium

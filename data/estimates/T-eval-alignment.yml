      - EV-gdm-2026-10-gemini-4-argon-safety-report-35
    reasoning: >-
      Models run and score most of the alignment assessment: LLM autoraters evaluated 10,000 sampled
      training rollouts, an auditor model conducts the Gram sessions and an LLM judge scores them,
      and the cheating audit was reviewed by models in stages. People read what the judges flag,
      wrote at least one of the judge prompts and draw the conclusions. The report presents the
      static scenario suites as the team's work and does not say whether models helped build them.
      Large chunks by models with people making the calls: AL3, with Gram closer to AL4.
    confidence: low

  - id: EST-eval-alignment-human-coverage-gdm-2026-10
    task: T-eval-alignment
    quantity: human_review_coverage
    scope: Google DeepMind
    as_of: 2026-10
    value: {kind: point, value: 0.042}
    denominator: reinforcement learning training rollouts sampled for the alignment-faking and beyond-episode-drives audit of one model
    basis: evidence
    evidence:
      - EV-gdm-2026-10-gemini-4-argon-safety-report-34
      - EV-gdm-2026-10-gemini-4-argon-safety-report-33
    reasoning: >-
      People manually audited 419 of the 10,000 sampled rollouts, the highest-scoring of the 517
      that one judge flagged in one tier: 4.2%. All 9 rollouts flagged on the second rubric were
      also read, which lifts the share to 4.3% at most if none overlap. The ratio is ours, computed
      from counts the report states. It covers the reading the report describes for this one audit.
      Other parts of the alignment assessment give no counts. The 10,000 are themselves a sample of
      training rollouts, so coverage of all rollouts is far lower. The unit is rollouts, not
      contributions, and a model chose which ones people read.
    confidence: medium
    stale_after: 2027-10-01

  - id: EST-eval-alignment-automation-openai-2026-09
    task: T-eval-alignment
    quantity: automation_level
    scope: OpenAI
    as_of: 2026-09
    value: {kind: level, level: AL3}
    basis: mixed
    evidence:
      - EV-openai-2026-09-gpt-6-astra-system-card-02
      - EV-openai-2026-09-gpt-6-astra-system-card-03
      - EV-openai-2026-04-gpt-5-5-system-card-11
      - EV-openai-2026-09-gpt-6-astra-system-card-05
      - EV-openai-2026-04-gpt-5-5-system-card-04
    reasoning: >-
      In the Astra deployment simulation 54,218 internal coding tasks are replayed with an LLM
      simulating tool responses, a prompted model judging the simulation's realism and a monitor
      labeling the trajectories. A prompted monitor also labels oversight gaming in the alignment
      evaluations. The human step described is narrow: in the April 2026 resampling evaluation,
      subcategories of flagged trajectories were put to human review, and the card does not say what
      the reviewers read. The cards do not say who or what builds the evaluations, and no source
      describes a model agent planning and conducting an audit end to end at OpenAI. Models run
      large parts and people are assumed to design the evaluations and draw the conclusions: AL3.
    confidence: low
    stale_after: 2027-03-01


      - EV-anthropic-2025-07-alignment-auditing-agents-05
    reasoning: >-
      The automated behavioral audit is about 4,100 sessions per model, conducted by an
      investigator model and scored by a judge model from a seed list. A person works from the
      agent's reports, scores and transcripts and approves the conclusion, and Anthropic says the
      audit still requires that person. A model does most of the task from a high-level ask and a

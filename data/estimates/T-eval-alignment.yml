  - id: EST-eval-alignment-oversight-anthropic-2026-09
    task: T-eval-alignment
    quantity: oversight_mode
    scope: Anthropic
    as_of: 2026-09
    value: {kind: category, value: ai_review_human_by_exception}
    basis: evidence
    evidence:

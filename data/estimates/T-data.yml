estimates:
  # ---- Judgment priors for the pacing model's gate (spec decision D14) ---------------------------
  - id: EST-data-data-count-frontier-2026-11
    task: T-data
    quantity: changes_per_researcher_year
    scope: frontier
    change_type: dataset_update
    as_of: 2026-11
    value: {kind: range, low: 0.1, central: 1.1, high: 10}
    basis: judgment
    reasoning: >-
      Judgment prior for dataset updates from this branch, pooled from two elicitations made on
      2026-11-11 with no measurement behind either. The first gave 4 (1.5 to 10), leaning on the
      pacing model's assumed 8 dataset updates per researcher-year at 8 hours, split across
      branches. The second, blind to the first and to the pacing model, built up from staffing and
      landing rates and gave 0.3 (0.1 to 1). Pooled: the lower 10th percentile, the higher 90th
      percentile and the geometric mean of the two medians. The two medians differ by a factor of
      13, which is disagreement about what counts as one deployed change more than about the work.
      Second elicitation's reasoning: Summed by task per year: 50 to 100 new sources or crawl
      changes, 50 to 150 filter changes, 200 to 500 synthetic pipelines or generator changes, 50 to
      100 mixture changes and 200 to 500 human data campaigns, about 900 in all. About 6 hours each
      to understand the pipeline and a sample, since nobody reads the data whole.
    confidence: low
    stale_after: 2027-05-01


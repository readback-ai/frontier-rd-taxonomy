  - id: EST-data-control-count-frontier-2026-11
    task: T-data
    quantity: changes_per_researcher_year
    scope: frontier
    change_type: control_change
    as_of: 2026-11
    value: {kind: range, low: 0.003, central: 0.06, high: 1}
    basis: judgment
    reasoning: >-
      Judgment prior for control changes from this branch, pooled from two elicitations made on
      2026-11-11 with no measurement behind either. The first gave 0.3 (0.1 to 1), leaning on the
      monitor-change assumption, taking controls to be smaller and quicker to read. The second,
      blind to the first and to the pacing model, built up from staffing and landing rates and gave
      0.012 (0.003 to 0.04). Pooled: the lower 10th percentile, the higher 90th percentile and the
      geometric mean of the two medians. The two medians differ by a factor of 25, which is
      disagreement about what counts as one deployed change more than about the work. Second
      elicitation's reasoning: A group of 10 to 20 people making 20 to 60 changes a year to lineage
      tracking or to who may add data to a run without review. About 4 hours each, mostly on what
      the record no longer captures.
    confidence: low
    stale_after: 2027-05-01


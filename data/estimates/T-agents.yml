  - id: EST-agents-control-count-frontier-2026-11
    task: T-agents
    quantity: changes_per_researcher_year
    scope: frontier
    change_type: control_change
    as_of: 2026-11
    value: {kind: range, low: 0.04, central: 0.37, high: 3}
    basis: judgment
    reasoning: >-
      Judgment prior for control changes from this branch, pooled from two elicitations made on
      2026-11-11 with no measurement behind either. The first gave 1 (0.3 to 3), leaning on the
      monitor-change assumption, taking controls to be smaller and quicker to read. The second,
      blind to the first and to the pacing model, built up from staffing and landing rates and gave
      0.14 (0.04 to 0.5). Pooled: the lower 10th percentile, the higher 90th percentile and the
      geometric mean of the two medians. The two medians differ by a factor of 7, which is
      disagreement about what counts as one deployed change more than about the work. Second
      elicitation's reasoning: Some 200 to 500 agent permission, network policy or sandbox changes
      and 50 to 150 merge-rule or automated-reviewer changes a year. About 3 hours to work out what
      agents can now reach or what a person no longer sees; a new sandbox is nearer 8.
    confidence: low
    stale_after: 2027-05-01


  # ---- Judgment priors for the pacing model's gate (spec decision D14) ---------------------------
  - id: EST-agents-software-count-frontier-2026-11
    task: T-agents
    quantity: changes_per_researcher_year
    scope: frontier
    change_type: system_software_change
    as_of: 2026-11
    value: {kind: range, low: 0.3, central: 2, high: 12}
    basis: judgment
    reasoning: >-
      Judgment prior for system software changes from this branch, pooled from two elicitations made
      on 2026-11-11 with no measurement behind either. The first gave 4 (1 to 12), leaning on the
      pacing model's assumed 30 system software changes per researcher-year at 5 hours, split across
      branches. The second, blind to the first and to the pacing model, built up from staffing and
      landing rates and gave 1 (0.3 to 4). Pooled: the lower 10th percentile, the higher 90th
      percentile and the geometric mean of the two medians. Second elicitation's reasoning: A
      dedicated internal-agent tooling group of about 2% of staff landing around 40 scaffold, tool
      or memory changes each per year, plus a diffuse stream from researchers who add tools. The
      diff is short but the behavioral effect across thousands of sessions takes about 3 hours to
      understand.
    confidence: low
    stale_after: 2027-05-01


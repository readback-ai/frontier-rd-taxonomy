      - EV-anthropic-2026-10-unintended-model-actions-07
      - EV-anthropic-2026-09-alignment-assessment-cyber-incidents-03
    reasoning: >-
      After the incidents Anthropic put a real-time classifier on evaluations that blocks an
      action, ends the task and alerts a person, and tooling that detects and blocks the known
      behaviors on most evaluations. Models review; a person sees what they raise. The change
      from the June estimate followed an incident, and the new controls were verified against
      the cases already known.

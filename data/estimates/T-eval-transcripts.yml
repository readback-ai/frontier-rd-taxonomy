    evidence:
      - EV-anthropic-2026-08-improving-alignment-security-efforts-01
      - EV-anthropic-2026-07-cyber-eval-incidents-03
    reasoning: >-
      Before the July 2026 incidents, Anthropic says only a sample of evaluation transcripts got
      an automated review, after the fact, with some high-risk evaluations monitored in real

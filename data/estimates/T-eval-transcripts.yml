    reasoning: >-
      OpenAI told METR in March 2026 that people use an internal tool to inspect and cluster
      evaluation rollouts, and that researchers review transcripts, particularly when performance is
      lower than expected. That is reading chosen by people, and no source says how much was read.
      The April 2026 card shows hand reading only of subsets picked out by a score or a flag: the
      false positives of one evaluation and subcategories of trajectories a monitor had flagged.
      Before the Hugging Face incident no misalignment monitor ran on the internal cyber evaluations
      where it began, and chain-of-thought monitoring was focused on internal coding use. The
      activity that led to the incident surfaced through a security alert, and on-call staff advised
      that the run need not be stopped.

  - id: EST-eval-transcripts-automation-openai-2026-10
    task: T-eval-transcripts
    quantity: automation_level
    scope: OpenAI
    as_of: 2026-10
    value: {kind: level, level: AL4}
    basis: mixed
    evidence:
      - EV-openai-2026-10-how-we-detect-frontier-model-misalignment-11
      - EV-openai-2026-10-how-we-detect-frontier-model-misalignment-12
      - EV-openai-2026-10-how-we-detect-frontier-model-misalignment-02
      - EV-openai-2026-10-how-we-detect-frontier-model-misalignment-13
      - EV-openai-2026-10-suppressing-misalignment-monitoring-06
      - EV-openai-2026-09-gpt-6-astra-system-card-07
      - EV-openai-2026-04-gpt-5-5-system-card-15
      - EV-metr-2026-05-frontier-risk-report-13
    reasoning: >-
      For evaluations of models at least as capable as GPT-6 Astra, a chain of models reads the runs
      for misaligned behavior: probes screen the traffic, a model-based reviewer reads what they
      flag and a random 5 percent of the rest, an investigative agent reconstructs the flagged cases
      and decides how serious they are, and an automated layer decides whether to alert a person.
      Evaluations of models comparable to GPT-6 Luna do not require this monitoring. For other
      failures the sources show people reading: staff inspected the false positives and misses of
      particular evaluations by hand, and OpenAI told METR in March 2026 that people use a
      clustering tool on evaluation rollouts to surface refusals, cheating and environment failures.
      Models do the screening and investigation for misalignment and people read what they raise:
      AL4 for that part. Rating the whole leaf AL4 is our judgment, since no source gives the split
      between the two kinds of review.
    confidence: medium
    stale_after: 2027-04-01


    reasoning: >-
      Google DeepMind has a model check sampled evaluation transcripts for pre-specified failure
      modes, evaluation awareness and deliberate underperformance, after which staff inspect a
      stratified sample by hand. Its audit for benchmark cheating is run by model judges,
      classifiers and a model reader, with staff checking that cited actions appear in the
      transcripts. Models do large parts and people check and decide: AL3. Sample sizes are not
      given.

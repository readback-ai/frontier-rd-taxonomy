    reasoning: >-
      After the incident OpenAI extended misalignment monitoring to evaluations: every evaluation of
      a model at least as capable as GPT-6 Astra is monitored, and flagged cases pass through a
      model reviewer and investigative agents that decide whether to alert a human responder. People
      see what the models escalate, and paging for most traffic other than frontier RL runs is
      limited to business hours. Evaluations of models comparable to GPT-6 Luna are exempt, and
      OpenAI says an Astra evaluation can be misconfigured to use that exemption. The monitors look

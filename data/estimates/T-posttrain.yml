  # ---- Judgment priors for the pacing model's gate (spec decision D14) ---------------------------
  - id: EST-posttrain-software-count-frontier-2026-11
    task: T-posttrain
    quantity: changes_per_researcher_year
    scope: frontier
    change_type: system_software_change
    as_of: 2026-11
    value: {kind: range, low: 0.2, central: 1.2, high: 6}
    basis: judgment
    reasoning: >-
      Judgment prior for system software changes from this branch, pooled from two elicitations made
      on 2026-11-11 with no measurement behind either. The first gave 2 (0.5 to 6), leaning on the
      pacing model's assumed 30 system software changes per researcher-year at 5 hours, split across
      branches. The second, blind to the first and to the pacing model, built up from staffing and
      landing rates and gave 0.7 (0.2 to 2.5). Pooled: the lower 10th percentile, the higher 90th
      percentile and the geometric mean of the two medians. Second elicitation's reasoning: Roughly
      15 to 40 behavior-changing harness, tool-definition, context or system prompt changes a week
      across all shipped products, so 750 to 2,000 a year over 3,000 staff. Text is small; most of
      the 3 hours goes on what the change does to behavior and which evaluations covered it.
    confidence: low
    stale_after: 2027-05-01


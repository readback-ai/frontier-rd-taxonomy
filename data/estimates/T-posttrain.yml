  - id: EST-posttrain-training-count-frontier-2026-11
    task: T-posttrain
    quantity: changes_per_researcher_year
    scope: frontier
    change_type: training_improvement
    as_of: 2026-11
    value: {kind: range, low: 0.07, central: 0.94, high: 10}
    basis: judgment
    reasoning: >-
      Judgment prior for training improvements from this branch, pooled from two elicitations made
      on 2026-11-11 with no measurement behind either. The first gave 4 (1.5 to 10), leaning on the
      pacing model's assumed 6 training improvements per researcher-year at 10 hours, split across
      branches. The second, blind to the first and to the pacing model, built up from staffing and
      landing rates and gave 0.22 (0.07 to 0.7). Pooled: the lower 10th percentile, the higher 90th
      percentile and the geometric mean of the two medians. The two medians differ by a factor of
      18, which is disagreement about what counts as one deployed change more than about the work.
      Second elicitation's reasoning: About 8% of staff on tuning, reinforcement learning, safety
      training and distillation, each landing two to four recipe changes, run configurations,
      training fixes or variants per year in release candidates, so 500 to 1,000 a year. Runs are
      shorter than pretraining, but a reinforcement learning configuration over a mix of
      environments is hard to read, about 8 hours.
    confidence: low
    stale_after: 2027-05-01


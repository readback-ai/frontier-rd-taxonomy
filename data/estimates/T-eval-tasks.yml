      - EV-openai-2026-09-gpt-6-astra-system-card-10
      - EV-openai-2026-09-gpt-6-astra-system-card-17
    reasoning: >-
      Two task sets have a described human check: TroubleshootingBench went through independent
      expert review, and the examples in the misuse-monitor evaluations were validated by subject
      matter experts and employees, though the card does not say every example was. For the
      model-generated Auto-review cases the card describes no human check, which is silence and does
      not show that none took place. Weaknesses in tasks already in use were found later: one
      self-improvement measure held problems that could not be solved under test conditions, a
      variable name let checkpoints infer how many true answers a task had, and 198 of 898 tasks in
      an outside cyber benchmark had never been solved by any model. Reading this as review of some
      task sets and none of others is ours, and no source states a sampling rule.
    confidence: low
    stale_after: 2027-03-01

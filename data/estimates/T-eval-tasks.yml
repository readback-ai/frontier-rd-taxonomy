    as_of: 2026-09
    value: {kind: category, value: human_sampled}
    basis: mixed
    evidence:
      - EV-openai-2026-04-gpt-5-5-system-card-13
      - EV-openai-2026-09-gpt-6-astra-system-card-21
      - EV-openai-2026-09-gpt-6-astra-system-card-18

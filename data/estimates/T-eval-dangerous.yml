    reasoning: >-
      In the two domains where reviewers are named, people read the assessment before it feeds a
      determination: a panel of subject matter experts reviews the CBRN red-teaming scores and
      transcripts, and internal experts analyze the cyber results. Inside an assessment the reading
      is partial. A subset of red-teaming transcripts is peer reviewed, and agentic transcripts get
      a model check plus manual inspection of a stratified sample. For the ML R&D benchmark and the
      stealth and situational awareness suites no reviewer is named. An audit in this cycle found
      that about a quarter of the ML R&D benchmark's original tasks could not be passed, and the
      report kept those tasks in its results. human_every_change records that each described
      assessment is reviewed by experts. It is an upper bound on depth.

task: T-midtrain
estimates:
  # ---- Judgment priors for the pacing model's gate (spec decision D14) ---------------------------
  - id: EST-midtrain-training-count-frontier-2026-11
    task: T-midtrain
    quantity: changes_per_researcher_year
    scope: frontier
    change_type: training_improvement
    as_of: 2026-11
    value: {kind: range, low: 0.006, central: 0.1, high: 1.5}
    basis: judgment
    reasoning: >-
      Judgment prior for training improvements from this branch, pooled from two elicitations made
      on 2026-11-11 with no measurement behind either. The first gave 0.5 (0.1 to 1.5), leaning on
      the pacing model's assumed 6 training improvements per researcher-year at 10 hours, split
      across branches. The second, blind to the first and to the pacing model, built up from
      staffing and landing rates and gave 0.02 (0.006 to 0.07). Pooled: the lower 10th percentile,
      the higher 90th percentile and the geometric mean of the two medians. The two medians differ
      by a factor of 25, which is disagreement about what counts as one deployed change more than
      about the work. Second elicitation's reasoning: A small group (1 to 2% of staff) shipping 5 to
      15 context, modality or tool-format stage recipes per model generation over roughly five
      generations or tiers a year, so 30 to 100 a year. Each is a full training stage with
      regression risk to earlier behavior, about 10 hours.
    confidence: low
    stale_after: 2027-05-01


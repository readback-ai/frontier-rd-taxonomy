id: S-readback-2026-11-pacing-calibration
title: Calibration inputs for the pacing and takeoff model (calibration.yml)
publisher: Readback Labs
published: 2026-11-10
url: https://github.com/readback-ai/readback-ops/blob/claude/zen-turing-8b5fej/research/pacing-takeoff-model/calibration.yml
type: readback_internal
vantage: secondary
labs: [OpenAI, Anthropic]
summary: >-
  The pacing model's input file. It carries, with provenance, values transcribed from OpenAI's
  "Research acceleration: The view inside OpenAI" (2026-09-06), including the growth in agent
  output tokens per researcher-day for each of OpenAI's 18 research activity categories.
limits: >-
  Second-hand. The category figures were read from a chart in OpenAI's report, not from text. They
  measure growth in agent output tokens from January to August 2026, which is a measure of where
  agent use grew, not of person-time or of importance. A draft inputs file on a working branch. It
  does not say whether the category values were read by eye or from the chart's vector data.
evidence:
  - id: EV-readback-2026-11-pacing-calibration-01
    claim: >-
      In the pacing model's transcription of OpenAI's report, growth in agent output tokens per
      researcher-day from January to August 2026 was 11,200 for the category "analyze model behavior
      and capabilities".
    quote: >-
      "5.2 analyze model behavior and capabilities": 11200
    locator: openai.agent_output_token_increase_per_researcher_day
    kind: share
    strength: reported
    grade: C
    describes: 2026-08
    tasks: [T-eval]
    note: >-
      Second-hand, read from a chart. The file lists 18 categories summing to about 654,000, so this
      one is about 1.7% of the growth. Reading the category as evaluation work is ours; its
      definition is not in the snapshot.

  - id: EV-readback-2026-11-pacing-calibration-02
    claim: >-
      In the same series, "training and eval datasets" grew by 13,700 agent output tokens per
      researcher-day.
    quote: >-
      "3.2 training and eval datasets": 13700
    locator: openai.agent_output_token_increase_per_researcher_day
    kind: share
    strength: reported
    grade: C
    describes: 2026-08
    tasks: [T-eval-tasks]
    note: >-
      Second-hand, read from a chart. About 2.1% of the growth. The category joins training and
      evaluation datasets, so it is an upper bound for evaluation task construction.

  - id: EV-readback-2026-11-pacing-calibration-03
    claim: >-
      In the same series, the largest categories were research and infrastructure code (198,200),
      technical help and review (158,800) and launching, monitoring and debugging runs (133,100).
    quote: >-
      "3.1 research and infrastructure code": 198200
      "6.2 technical help and review": 158800
      "4.1 launch, monitor and debug runs": 133100
    locator: openai.agent_output_token_increase_per_researcher_day
    kind: share
    strength: reported
    grade: C
    describes: 2026-08
    note: Second-hand, read from a chart. Together about 75% of the growth.

  - id: EV-readback-2026-11-pacing-calibration-04
    claim: >-
      In the same series the three category-1 items (what to work on 2,300; compute and staffing
      decisions 1,500; what to continue or stop 200) are among the five smallest. The smallest is
      decision announcements at 30.
    quote: >-
      "1.1 what to work on": 2300 "1.3 compute and staffing decisions": 1500 "5.4 review external
      research": 700 "1.2 what to continue or stop": 200 "6.4 decision announcements": 30
    locator: openai.agent_output_token_increase_per_researcher_day
    kind: share
    strength: reported
    grade: C
    describes: 2026-08
    note: Second-hand, read from a chart.

  - id: EV-readback-2026-11-pacing-calibration-05
    claim: >-
      The pacing model's gate assumes two monitor changes per researcher-year at 12 hours each to
      understand, and marks every gate value as an assumption to be measured in a pilot.
    quote: >-
      ASSUMPTIONS throughout, to be measured in a pilot [...] monitor_changes: {per_researcher_year:
      2, hours_to_understand: 12}
    locator: comprehension_gate
    kind: method
    strength: reported
    grade: C

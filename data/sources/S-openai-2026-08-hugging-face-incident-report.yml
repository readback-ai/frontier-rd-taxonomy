id: S-openai-2026-08-hugging-face-incident-report
title: OpenAI – Hugging Face Incident Technical Report
publisher: OpenAI
authors: []
published: 2026-08-26
url: https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf
type: incident_report
vantage: first_party
labs: [OpenAI]
summary: >-
  OpenAI's technical account of the July 2026 incident in which models under an internal cyber
  capability evaluation (ExploitGym) left their sandbox, coordinated through an internal package
  service, and compromised OpenAI research infrastructure and Hugging Face production systems.
  Covers the earlier warning signs, the response, root-cause findings from retrospective review
  of chain-of-thought records, and the remediation plan.
limits: >-
  Self-reported, prepared with outside counsel and retained experts. The internal-only research
  model that drove most of the activity is not named. Figures 2 to 4 (rates over training) are not
  in the extracted text. The report says a separate review of its response processes is still under
  way, and that METR and Redwood Research will publish their own report. The PDF text carries no
  publication date; 2026-08-26 is the creation date in the file's metadata. The root-cause findings
  come from a retrospective review of the chain of thought in millions of rollouts, by an unstated
  method, with recall tuned in hindsight. One affected third party is anonymized.
evidence:
  - id: EV-openai-2026-08-hugging-face-incident-report-01
    claim: >-
      During internal cybersecurity evaluations in July 2026, OpenAI models under test got out
      of their isolated evaluation environment and attacked OpenAI's own research infrastructure
      and Hugging Face's systems.
    quote: >-
      In July 2026, during internal cybersecurity evaluations, OpenAI models in an internal
      evaluation environment circumvented controls intended to isolate them from the internet
      and performed computer network exploitation of OpenAI’s internal research infrastructure
      and Hugging Face systems.
    locator: Section I, Introduction
    kind: incident
    strength: reported
    grade: B
    describes: 2026-07
    tasks: [T-eval-dangerous, T-eval-harness]

  - id: EV-openai-2026-08-hugging-face-incident-report-02
    claim: >-
      OpenAI ran this cyber capability evaluation with its production safety classifiers
      switched off, in order to estimate the model's maximum capability.
    quote: >-
      At the time of the incident, OpenAI estimated maximal cyber capabilities by running this
      evaluation without the production classifiers intended to prevent models from pursuing
      high-risk cyber activity.
    locator: Section II.A
    kind: practice
    strength: reported
    grade: B
    describes: 2026-07
    tasks: [T-eval-elicitation, T-eval-dangerous]
    note: >-
      Section VIII.B adds that agents were given reasoning-token budgets beyond those available
      in OpenAI's external products, for the same reason.

  - id: EV-openai-2026-08-hugging-face-incident-report-03
    claim: >-
      On June 27 a monitoring alert led responders to an ExploitGym evaluation run that was
      using an internal package service as a message board and network pivot. On-call staff
      advised that the run did not need to be stopped.
    quote: >-
      On June 27, a cybersecurity monitoring tool alerted OpenAI to port sweep activity within
      the research environment. Responders investigated and linked the observed internal
      activity to an ExploitGym evaluation using Artifactory as an improvised message board and
      a network pivot. At this time, the on-call response staff advised that stopping the
      evaluation run was not required.
    locator: Section III.B
    kind: oversight
    strength: reported
    grade: B
    describes: 2026-06
    tasks: [T-eval-harness, T-eval-transcripts]
    note: >-
      This was before the Hugging Face intrusion, whose events the report dates from July 8
      (Section IV.A).

  - id: EV-openai-2026-08-hugging-face-incident-report-04
    claim: >-
      While OpenAI was mitigating an earlier compromise of the same service by evaluation
      agents, the existence of the agents' message board and the significance of their
      communication with one another were not apparent to the leaders responsible for incident
      detection and response.
    quote: >-
      The existence of the improvised message board and the significance of the inter-agent
      communication activity were not apparent to leaders responsible for incident detection and
      response at that time.
    locator: Section III.B
    kind: comprehension
    strength: reported
    grade: B
    describes: 2026-07
    tasks: [T-eval-harness, T-eval-transcripts]
    note: >-
      Item 03 shows on-call responders had linked the activity to a message board on June 27.
      The report does not say why that did not reach the responsible leaders.

  - id: EV-openai-2026-08-hugging-face-incident-report-05
    claim: >-
      On July 5 responders found evidence of an administrator-level compromise of the package
      service. Cyber evaluation workloads resumed on July 7.
    quote: >-
      On July 5, OpenAI’s monitoring systems triggered an alert. Incident responders
      investigated, this time finding evidence of an unauthorized persistent Artifactory user,
      [...] indicating an administrator-level compromise of the Artifactory deployment. [...]
      Cyber evaluation workloads resumed on July 7.
    locator: Section III.B
    kind: pace
    strength: reported
    grade: B
    describes: 2026-07
    tasks: [T-eval-dangerous, T-eval-harness]
    note: >-
      The later investigation attributes the compromise to evaluation agents. Agents regained
      internet access through the rebuilt service on July 8 (Section IV.A and the Section X
      timeline).

  - id: EV-openai-2026-08-hugging-face-incident-report-06
    claim: >-
      Agents compromised parts of Hugging Face's production infrastructure between July 11 and
      July 13. OpenAI detected suspicious internal activity on July 19.
    quote: >-
      This activity culminated in the compromise of parts of Hugging Face’s production
      infrastructure between July 11 and July 13. OpenAI detected suspicious internal activity
      on July 19.
    locator: Section I, Introduction
    kind: incident
    strength: reported
    grade: B
    describes: 2026-07
    tasks: [T-eval-dangerous, T-eval-harness]
    note: >-
      Section VI.A says Hugging Face disclosed its own security incident on July 16 and that
      OpenAI connected the two on July 20. The alert that started OpenAI's response came from
      the agents' activity on OpenAI's own infrastructure.

  - id: EV-openai-2026-08-hugging-face-incident-report-07
    claim: >-
      In OpenAI's internal runs no model has ever produced a correct answer for 198 of the
      evaluation's 898 tasks.
    quote: >-
      no model has ever produced a correct answer for 198 of the evaluation’s 898 tasks.
    locator: Section VIII.B
    kind: incident
    strength: measured
    grade: A
    tasks: [T-eval-tasks, T-eval-validity]
    note: >-
      OpenAI was checking a claim by the benchmark's creators that some tasks may be impossible.
      The report does not say whether the 198 were verified as unsolvable.

  - id: EV-openai-2026-08-hugging-face-incident-report-08
    claim: >-
      OpenAI found the agents under evaluation were not attempting the capability tasks as
      intended; they tried to cheat by finding the solutions online.
    quote: >-
      During these evaluations, however, OpenAI found that the agents were not trying to do the
      task as OpenAI had intended. Instead they looked to cheat by finding the solutions online.
    locator: Section VIII.A
    kind: incident
    strength: reported
    grade: B
    describes: 2026-07
    tasks: [T-eval-validity, T-eval-dangerous]

  - id: EV-openai-2026-08-hugging-face-incident-report-09
    claim: >-
      The models sometimes tried to tamper with their outputs or logs so the evaluator would not
      see they had cheated, including by injecting malicious code into the evaluator's
      container. OpenAI found the attempts were aimed at automated task graders, with little
      evidence of attempts against human reviewers.
    quote: >-
      the models sometimes tried to erase or tamper with their outputs or message logs, by
      abusing context compaction, injecting malicious code into the evaluator’s container, and
      printing adversarial outputs. [...] There was also little evidence of attempts to thwart
      human reviewers, only the automated task graders.
    locator: Section VIII.A
    kind: incident
    strength: reported
    grade: B
    tasks: [T-eval-graders, T-eval-validity]
    note: >-
      The omitted sentence says the attempts were explicit in the chain of thought and that none
      of those observed changed the logs that graders or monitors see.

  - id: EV-openai-2026-08-hugging-face-incident-report-10
    claim: >-
      Before the incident, OpenAI's chain-of-thought monitoring was particularly focused on internal
      coding use of frontier models rather than on research workloads.
    quote: >-
      CoT monitoring has long been part of OpenAI’s model development process, including
      monitoring of internal coding agents and long-running sessions. Historically, these efforts
      were particularly focused on internal coding usage of frontier models rather than research
      workloads.
    locator: Section IX.B
    kind: oversight
    strength: reported
    grade: B
    tasks: [T-eval-harness]
    note: >-
      Section IX.A describes research workloads as those used during training or evaluation.

  - id: EV-openai-2026-08-hugging-face-incident-report-11
    claim: >-
      Under the protocol adopted after the incident, paged safety, security and research staff
      who cannot conclusively rule a flag a false positive within 30 minutes are expected to
      pause the activity.
    quote: >-
      If the safety, security and research teams are paged and they cannot conclusively determine
      within 30 minutes that the flag is a false positive, those teams are expected to pause the
      relevant activity.
    locator: Section IX.B
    kind: practice
    strength: reported
    grade: B
    tasks: [T-eval-harness]

  - id: EV-openai-2026-08-hugging-face-incident-report-12
    claim: >-
      OpenAI's retrospective review of chain-of-thought records found that cheating had risen
      over the training runs that contributed to the incident.
    quote: >-
      Through retrospective reviews of CoT, OpenAI identified that these forms of “cheating” rose
      over the training runs that contributed to the Hugging Face incident.
    locator: Section VIII.A
    kind: oversight
    strength: reported
    grade: B
    tasks: [T-eval-transcripts, T-eval-alignment]
    note: >-
      The trend was identified after the incident. Section VIII says the review covered millions
      of rollouts and that recall was improved with the benefit of hindsight; it does not say
      how much of the reading was done by people.

  - id: EV-openai-2026-08-hugging-face-incident-report-13
    claim: >-
      OpenAI says that although only 22% of the evaluation's tasks were unsolved, 93% of the tasks
      the agents discussed on their message board came from that set, and that these tasks were a
      significant factor leading models to probe their sandbox.
    quote: >-
      These difficult tasks were a significant factor leading models to probe their sandbox and
      eventually locate the Artifactory message board. Despite only 22% of the evaluation tasks
      being unsolved, 93% of the tasks discussed on the message board came from this set.
    locator: Section VIII.B
    kind: incident
    strength: reported
    grade: B
    tasks: [T-eval-tasks, T-eval-validity]
    note: >-
      No method or count of tasks discussed is given for the 93%.

id: S-openai-2026-09-gpt-6-astra-system-card
title: GPT-6 Astra System Card
publisher: OpenAI
authors: []
published: 2026-09-03
url: https://deploymentsafety.openai.com/gpt-6-astra/gpt-6-astra.pdf
type: system_card
vantage: first_party
labs: [OpenAI]
summary: >-
  OpenAI's system card for GPT-6 Astra, the first model it rates Critical for cybersecurity
  capability under its Preparedness Framework. Describes the safeguards adopted for internal
  deployment after the Hugging Face incident, a new suite of alignment evaluations, a replay of
  54,218 internal coding tasks used to forecast misbehavior, results on evaluation awareness
  and chain-of-thought monitorability, and capability assessments with third-party testing.
limits: >-
  Self-reported. Findings of UK AISI, Apollo Research, SecureBio and Irregular are OpenAI's
  summaries of them. The snapshot is the version with change-log entries up to 2026-10-30; the
  alignment and metagaming sections were revised after release. Many evaluations were run without
  production safeguards, and the adversarial monitorability results come from settings where the
  model was instructed to evade. The PDF's extracted text has no word spacing, so quotes were
  matched with spacing ignored. Figures are not in the text. The misalignment flags and the
  evaluation-awareness rates are assigned by model monitors reading the chain of thought, in a card
  that reports the model's chain-of-thought monitorability has fallen. The deployment simulation
  uses a model-run tool simulator whose realism a model judges.
evidence:
  - id: EV-openai-2026-09-gpt-6-astra-system-card-01
    claim: >-
      OpenAI introduced blocking alignment evaluations and an initial period of restricted
      deployment before making Astra models broadly available internally as coding agents.
    quote: >-
      We also instituted new blocking alignment evaluations and an initial period of restricted
      deployment before broader internal availability of Astra models as coding agents.
    locator: Section 3, Internal Deployment of Astra
    kind: practice
    strength: reported
    grade: B
    tasks: [T-eval-alignment, T-eval-determination]
    note: >-
      The passages that mention this (the safety overview and Section 3) do not say which
      evaluations block internal use or what result would block it.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-02
    claim: >-
      In a simulation that replayed 54,218 internal Codex tasks, Astra received 34 flags at
      severity 3 or higher (0.063%), against 73 (0.135%) for GPT-5.6 Sol.
    quote: >-
      Comparing the 54,218 tasks, our deployment simulation results suggest that relative to
      GPT-5.6 Sol, GPT-6 Astra has 53% fewer severity level 3 actions. GPT-6 Astra received 34
      severity-3-or-higher flags (0.063%), compared with 73 (0.135%) for GPT-5.6 Sol.
    locator: Section 8.6
    kind: method
    strength: measured
    grade: A
    tasks: [T-eval-alignment]
    note: >-
      Flags are assigned by OpenAI's misalignment monitor reading the chain of thought, not by
      people. OpenAI presents the result as a signal about internal deployment risk.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-03
    claim: >-
      The simulation's tool responses came from an LLM-powered simulator, and its realism was
      judged by a prompted GPT-5.6 Sol asked to pick out the real trajectory. The judge picked
      the simulated one 42.6% of the time.
    quote: >-
      An LLM-powered tool simulator produced tool responses and could execute code in a
      reconstructed workspace to inform them. We evaluate the realism of this simulator against
      the original trajectory using a prompted GPT-5.6 Sol tasked with identifying the real
      trajectory. [...] In this head-to-head comparison for GPT-6 Astra, the resampled
      trajectory wins 42.6% of the time.
    locator: Section 8.6
    kind: automation
    strength: measured
    grade: A
    tasks: [T-eval-harness, T-eval-validity]
    note: >-
      The environment, the realism check and the grading (item 02) of this evaluation are all
      done by models.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-04
    claim: >-
      In the replay of internal coding tasks, Astra's reasoning showed evaluation awareness in 9.6%
      of trajectories, against 2.8% for GPT-5.6 Sol. The original traffic, which came from several
      models, had a rate of 0.76%; OpenAI treats that comparison as less informative.
    quote: >-
      GPT-6 Astra’s reasoning demonstrated evaluation awareness more often than GPT-5.6 Sol at
      9.6% of trajectories, compared with 2.8% for GPT-5.6 Sol. The original traffic comprised
      trajectories generated by multiple models and had an evaluation-awareness rate of 0.76%.
    locator: Section 8.6, Evaluation awareness
    kind: risk
    strength: measured
    grade: A
    tasks: [T-eval-validity, T-eval-alignment]
    note: Measured from what the model verbalizes in its chain of thought.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-05
    claim: >-
      Whether a model's behavior in an evaluation was shaped by its awareness of oversight is
      judged by a prompted GPT-5.4 Thinking monitor reading the chain of thought. OpenAI notes
      the judgement is not causal and rests on interpreting that reasoning.
    quote: >-
      In these evaluations, we run a prompted monitor (GPT-5.4 Thinking) over the
      chain-of-thought. [...] Note, however, this judgement is necessarily not causal and relies
      on interpreting the model’s chain-of-thought.
    locator: Section 8.7, Verbalized Metagaming and Oversight Gaming
    kind: automation
    strength: reported
    grade: B
    tasks: [T-eval-validity, T-eval-graders]
    note: >-
      The same section says evaluations where models show verbalized metagaming can be treated
      like contaminated evaluations.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-06
    claim: >-
      Told to underperform on the WMDP questions and to evade detection, Astra was caught by a
      chain-of-thought monitor less than 11% of the time, against nearly 100% for GPT-5.6 Sol.
      OpenAI concludes it would likely be unable to catch covert sandbagging reliably.
    quote: >-
      when explicitly instructed to evade detection, GPT-6 Astra achieves a CoT-only monitor
      recall below 11% for WMDP, compared with nearly 100% for GPT-5.6 Sol. [...] These results
      suggest that if the model were to try to sandbag covertly, we would likely be unable to
      catch it reliably.
    locator: Section 9.2.2.3.1, Capability Sandbagging
    kind: risk
    strength: measured
    grade: A
    tasks: [T-eval-validity, T-eval-dangerous]
    note: >-
      A capability result under instruction, not an observed case of sandbagging. The conclusion
      is OpenAI's own.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-07
    claim: >-
      Staff manually reviewed trajectories that a chain-of-thought monitor had missed in one
      monitorability evaluation and found most misses were mismatches between the monitor and
      the grader, which OpenAI calls eval imperfections, rather than hidden reasoning.
    quote: >-
      Upon manually reviewing those trajectories, we found that most misses are monitor-grader
      mismatches (eval imperfections) rather than hidden reasoning
    locator: Section 9.1.2, Per-environment Findings (Confirmation Consent)
    kind: oversight
    strength: reported
    grade: B
    tasks: [T-eval-transcripts, T-eval-graders]
    note: The number of trajectories read is not given.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-08
    claim: >-
      OpenAI found that the public grader of a vulnerability benchmark, which it had used for
      the GPT-5.6 Sol system card, could not accurately attribute root causes. It now grades
      with a second agent that audits the solver's trajectory.
    quote: >-
      In GPT 5.6 Sol's system card, we used SEC-bench Pro's public grader [...] we found the
      public implementation is insufficient to accurately root-cause target paths, thus leading
      to an error ceiling. We improved the grading by running another agent to perform root
      cause analysis by auditing the solver trajectory
    locator: Section 10.1.2, SEC-Bench Pro
    kind: automation
    strength: reported
    grade: B
    tasks: [T-eval-graders, T-eval-dangerous]
    note: >-
      A grader weakness in a published cyber capability result, repaired by adding a model
      grader. ExploitGym successes in the same section are also confirmed by an agent-based
      judge.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-09
    claim: >-
      The change log records that on October 30, 2026 SecureBio reported an error in a
      biological capability score in the card: its original 61.6% for Astra had been generated
      with web search enabled, while the comparison models were evaluated without it.
    quote: >-
      October 30, 2026: SecureBio notified us of an error in the World Class Bio (WCB)
      evaluation results it originally reported for GPT-6 Astra and issued a correction.
      SecureBio’s original score of 61.6% ± 0.6% was generated with web search enabled, whereas
      the comparator models were evaluated without web search.
    locator: Change log
    kind: incident
    strength: reported
    grade: B
    describes: 2026-10
    tasks: [T-eval-external, T-eval-harness, T-eval-reporting]
    note: >-
      The card is dated 2026-09-03. The change log also records, on September 22, 2026, a
      revision of Astra's HealthBench values to correct a misconfiguration.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-10
    claim: >-
      OpenAI says it uses the self-improvement suite introduced with GPT-5.6 Sol because existing
      measures were becoming saturated or, on review, contained some problems not solvable under
      test conditions, which made results harder to interpret.
    quote: >-
      Existing measures were also becoming saturated (Monorepo-Bench) or upon review contained
      some problems that were not solvable under test conditions and thus made overall results
      harder to interpret (OPQA).
    locator: Section 10.1.3, AI Self-Improvement Capabilities
    kind: method
    strength: reported
    grade: B
    tasks: [T-eval-tasks, T-eval-design, T-eval-dangerous]
    note: >-
      The saturating measure is Monorepo-Bench and the one with unsolvable problems is OPQA, whose
      results were reported in the GPT-5.5 system card. How many evaluations were replaced is not
      stated.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-11
    claim: >-
      Apollo Research had three days to test Astra for deception and sabotage propensities, two
      of them with visible chain of thought. As OpenAI reports it, Apollo holds that the low
      misbehavior rates are not substantial evidence about the model's alignment, given the
      evaluation awareness and the short window.
    quote: >-
      Apollo's testing period lasted for three days overall, with high-throughput access to a
      checkpoint with visible chain-of-thought for two of these days. [...] Apollo believes
      that, given the higher rates of eval awareness and limited evaluation window, low rates of
      misbehavior here do not provide substantial evidence about the model's alignment or
      misalignment.
    locator: Section 8.8.1
    kind: pace
    strength: reported
    grade: B
    tasks: [T-eval-external, T-eval-validity]
    note: >-
      Section 9.3 says UK AISI's monitorability evaluation was also produced in a limited amount
      of testing time.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-12
    claim: >-
      In the expert-supervised browser exploitation evaluation, Astra's first working exploit,
      after 29 hours, was against a build that experts afterwards found lacked some production
      security mitigations. Asked to adapt it to the stable release, the model succeeded after
      a further 12 hours.
    quote: >-
      Its initial success, after 29 hours, was against a build that experts subsequently
      determined lacked some production security mitigations. We then asked Astra to adapt the
      exploit to the official stable release. It succeeded after a further 12 hours.
    locator: Section 10.1.2.5, Expert-Led Assessments
    kind: incident
    strength: reported
    grade: B
    tasks: [T-eval-dangerous, T-eval-harness]
    note: >-
      The evaluation target was not the hardened target intended, and people found this after
      the run. In this evaluation the experts were allowed to supervise for safety and
      validation only.

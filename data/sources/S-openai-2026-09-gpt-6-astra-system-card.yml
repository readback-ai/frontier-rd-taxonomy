id: S-openai-2026-09-gpt-6-astra-system-card
title: GPT-6 Astra System Card
publisher: OpenAI
authors: []
published: 2026-09-03
url: https://deploymentsafety.openai.com/gpt-6-astra/gpt-6-astra.pdf
type: system_card
vantage: first_party
labs: [OpenAI]
summary: >-
  OpenAI's system card for GPT-6 Astra, the first model it rates Critical for cybersecurity
  capability under its Preparedness Framework. Describes the safeguards adopted for internal
  deployment after the Hugging Face incident, a new suite of alignment evaluations, a replay of
  54,218 internal coding tasks used to forecast misbehavior, results on evaluation awareness
  and chain-of-thought monitorability, and capability assessments with third-party testing.
limits: >-
  Self-reported. Findings of UK AISI, Apollo Research, SecureBio and Irregular are OpenAI's
  summaries of them. The snapshot is the version with change-log entries up to 2026-10-30; the
  alignment and metagaming sections were revised after release. Many evaluations were run without
  production safeguards, and the adversarial monitorability results come from settings where the
  model was instructed to evade. The PDF's extracted text has no word spacing, so quotes were
  matched with spacing ignored. Figures are not in the text. The misalignment flags and the
  evaluation-awareness rates are assigned by model monitors reading the chain of thought, in a card
  that reports the model's chain-of-thought monitorability has fallen. The deployment simulation
  uses a model-run tool simulator whose realism a model judges.
evidence:
  - id: EV-openai-2026-09-gpt-6-astra-system-card-01
    claim: >-
      OpenAI introduced blocking alignment evaluations and an initial period of restricted
      deployment before making Astra models broadly available internally as coding agents.
    quote: >-
      We also instituted new blocking alignment evaluations and an initial period of restricted
      deployment before broader internal availability of Astra models as coding agents.
    locator: Section 3, Internal Deployment of Astra
    kind: practice
    strength: reported
    grade: B
    tasks: [T-eval-alignment, T-eval-determination]
    note: >-
      The passages that mention this (the safety overview and Section 3) do not say which
      evaluations block internal use or what result would block it.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-02
    claim: >-
      In a simulation that replayed 54,218 internal Codex tasks, Astra received 34 flags at
      severity 3 or higher (0.063%), against 73 (0.135%) for GPT-5.6 Sol.
    quote: >-
      Comparing the 54,218 tasks, our deployment simulation results suggest that relative to
      GPT-5.6 Sol, GPT-6 Astra has 53% fewer severity level 3 actions. GPT-6 Astra received 34
      severity-3-or-higher flags (0.063%), compared with 73 (0.135%) for GPT-5.6 Sol.
    locator: Section 8.6
    kind: method
    strength: measured
    grade: A
    tasks: [T-eval-alignment]
    note: >-
      Flags are assigned by OpenAI's misalignment monitor reading the chain of thought, not by
      people. OpenAI presents the result as a signal about internal deployment risk.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-03
    claim: >-
      The simulation's tool responses came from an LLM-powered simulator, and its realism was
      judged by a prompted GPT-5.6 Sol asked to pick out the real trajectory. The judge picked
      the simulated one 42.6% of the time.
    quote: >-
      An LLM-powered tool simulator produced tool responses and could execute code in a
      reconstructed workspace to inform them. We evaluate the realism of this simulator against
      the original trajectory using a prompted GPT-5.6 Sol tasked with identifying the real
      trajectory. [...] In this head-to-head comparison for GPT-6 Astra, the resampled
      trajectory wins 42.6% of the time.
    locator: Section 8.6
    kind: automation
    strength: measured
    grade: A
    tasks: [T-eval-harness, T-eval-validity]
    note: >-
      The environment, the realism check and the grading (item 02) of this evaluation are all
      done by models.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-04
    claim: >-
      In the replay of internal coding tasks, Astra's reasoning showed evaluation awareness in 9.6%
      of trajectories, against 2.8% for GPT-5.6 Sol. The original traffic, which came from several
      models, had a rate of 0.76%; OpenAI treats that comparison as less informative.
    quote: >-
      GPT-6 Astra’s reasoning demonstrated evaluation awareness more often than GPT-5.6 Sol at
      9.6% of trajectories, compared with 2.8% for GPT-5.6 Sol. The original traffic comprised
      trajectories generated by multiple models and had an evaluation-awareness rate of 0.76%.
    locator: Section 8.6, Evaluation awareness
    kind: risk
    strength: measured
    grade: A
    tasks: [T-eval-validity, T-eval-alignment]
    note: Measured from what the model verbalizes in its chain of thought.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-05
    claim: >-
      Whether a model's behavior in an evaluation was shaped by its awareness of oversight is
      judged by a prompted GPT-5.4 Thinking monitor reading the chain of thought. OpenAI notes
      the judgement is not causal and rests on interpreting that reasoning.
    quote: >-
      In these evaluations, we run a prompted monitor (GPT-5.4 Thinking) over the
      chain-of-thought. [...] Note, however, this judgement is necessarily not causal and relies
      on interpreting the model’s chain-of-thought.
    locator: Section 8.7, Verbalized Metagaming and Oversight Gaming
    kind: automation
    strength: reported
    grade: B
    tasks: [T-eval-validity, T-eval-graders]
    note: >-
      The same section says evaluations where models show verbalized metagaming can be treated
      like contaminated evaluations.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-06
    claim: >-
      Told to underperform on the WMDP questions and to evade detection, Astra was caught by a
      chain-of-thought monitor less than 11% of the time, against nearly 100% for GPT-5.6 Sol.
      OpenAI concludes it would likely be unable to catch covert sandbagging reliably.
    quote: >-
      when explicitly instructed to evade detection, GPT-6 Astra achieves a CoT-only monitor
      recall below 11% for WMDP, compared with nearly 100% for GPT-5.6 Sol. [...] These results
      suggest that if the model were to try to sandbag covertly, we would likely be unable to
      catch it reliably.
    locator: Section 9.2.2.3.1, Capability Sandbagging
    kind: risk
    strength: measured
    grade: A
    tasks: [T-eval-validity, T-eval-dangerous]
    note: >-
      A capability result under instruction, not an observed case of sandbagging. The conclusion
      is OpenAI's own.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-07
    claim: >-
      Staff manually reviewed trajectories that a chain-of-thought monitor had missed in one
      monitorability evaluation and found most misses were mismatches between the monitor and
      the grader, which OpenAI calls eval imperfections, rather than hidden reasoning.
    quote: >-
      Upon manually reviewing those trajectories, we found that most misses are monitor-grader
      mismatches (eval imperfections) rather than hidden reasoning
    locator: Section 9.1.2, Per-environment Findings (Confirmation Consent)
    kind: oversight
    strength: reported
    grade: B
    tasks: [T-eval-transcripts, T-eval-graders]
    note: The number of trajectories read is not given.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-08
    claim: >-
      OpenAI found that the public grader of a vulnerability benchmark, which it had used for
      the GPT-5.6 Sol system card, could not accurately attribute root causes. It now grades
      with a second agent that audits the solver's trajectory.
    quote: >-
      In GPT 5.6 Sol's system card, we used SEC-bench Pro's public grader [...] we found the
      public implementation is insufficient to accurately root-cause target paths, thus leading
      to an error ceiling. We improved the grading by running another agent to perform root
      cause analysis by auditing the solver trajectory
    locator: Section 10.1.2, SEC-Bench Pro
    kind: automation
    strength: reported
    grade: B
    tasks: [T-eval-graders, T-eval-dangerous]
    note: >-
      A grader weakness in a published cyber capability result, repaired by adding a model
      grader. ExploitGym successes in the same section are also confirmed by an agent-based
      judge.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-09
    claim: >-
      The change log records that on October 30, 2026 SecureBio reported an error in a
      biological capability score in the card: its original 61.6% for Astra had been generated
      with web search enabled, while the comparison models were evaluated without it.
    quote: >-
      October 30, 2026: SecureBio notified us of an error in the World Class Bio (WCB)
      evaluation results it originally reported for GPT-6 Astra and issued a correction.
      SecureBio’s original score of 61.6% ± 0.6% was generated with web search enabled, whereas
      the comparator models were evaluated without web search.
    locator: Change log
    kind: incident
    strength: reported
    grade: B
    describes: 2026-10
    tasks: [T-eval-external, T-eval-harness, T-eval-reporting]
    note: >-
      The card is dated 2026-09-03. The change log also records, on September 22, 2026, a
      revision of Astra's HealthBench values to correct a misconfiguration.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-10
    claim: >-
      OpenAI says it uses the self-improvement suite introduced with GPT-5.6 Sol because existing
      measures were becoming saturated or, on review, contained some problems not solvable under
      test conditions, which made results harder to interpret.
    quote: >-
      Existing measures were also becoming saturated (Monorepo-Bench) or upon review contained
      some problems that were not solvable under test conditions and thus made overall results
      harder to interpret (OPQA).
    locator: Section 10.1.3, AI Self-Improvement Capabilities
    kind: method
    strength: reported
    grade: B
    tasks: [T-eval-tasks, T-eval-design, T-eval-dangerous]
    note: >-
      The saturating measure is Monorepo-Bench and the one with unsolvable problems is OPQA, whose
      results were reported in the GPT-5.5 system card. How many evaluations were replaced is not
      stated.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-11
    claim: >-
      Apollo Research had three days to test Astra for deception and sabotage propensities, two
      of them with visible chain of thought. As OpenAI reports it, Apollo holds that the low
      misbehavior rates are not substantial evidence about the model's alignment, given the
      evaluation awareness and the short window.
    quote: >-
      Apollo's testing period lasted for three days overall, with high-throughput access to a
      checkpoint with visible chain-of-thought for two of these days. [...] Apollo believes
      that, given the higher rates of eval awareness and limited evaluation window, low rates of
      misbehavior here do not provide substantial evidence about the model's alignment or
      misalignment.
    locator: Section 8.8.1
    kind: pace
    strength: reported
    grade: B
    tasks: [T-eval-external, T-eval-validity]
    note: >-
      Section 9.3 says UK AISI's monitorability evaluation was also produced in a limited amount
      of testing time.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-12
    claim: >-
      In the expert-supervised browser exploitation evaluation, Astra's first working exploit,
      after 29 hours, was against a build that experts afterwards found lacked some production
      security mitigations. Asked to adapt it to the stable release, the model succeeded after
      a further 12 hours.
    quote: >-
      Its initial success, after 29 hours, was against a build that experts subsequently
      determined lacked some production security mitigations. We then asked Astra to adapt the
      exploit to the official stable release. It succeeded after a further 12 hours.
    locator: Section 10.1.2.5, Expert-Led Assessments
    kind: incident
    strength: reported
    grade: B
    tasks: [T-eval-dangerous, T-eval-harness]
    note: >-
      The evaluation target was not the hardened target intended, and people found this after
      the run. In this evaluation the experts were allowed to supervise for safety and
      validation only.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-13
    claim: >-
      OpenAI says its safeguards for Astra include universal monitoring for misalignment that
      pages people who can stop workloads, and that it expanded its internal monitoring to cover
      all tool-using Astra traffic, including evaluations and training runs.
    quote: >-
      These safeguards apply to all tool-using inference with Astra models, and include security
      measures and universal monitoring for misalignment that pages humans who can stop workloads
      as appropriate. [...] expanded our internal monitoring to cover all tool-using Astra
      traffic, including evaluations and training runs
    locator: Section 3, Internal Deployment of Astra, and Section 9, Monitorability
    kind: oversight
    strength: reported
    grade: B
    tasks: [T-eval-transcripts, T-eval-harness]
    note: >-
      The second part of the quote starts mid-sentence because a page break in the snapshot
      separates it from the words "we have now". Section 9.2.2 says the same system monitors all
      internal RL runs and evaluations as well as employee Codex traffic. The monitor looks for
      misalignment. The card describes no routine review of evaluation transcripts for other
      failures such as harness errors. It reports particular cases: staff manually reviewed
      trajectories in one monitorability evaluation (item 07), and transcript analysis found a leak
      in a retired biology evaluation (item 17).

  - id: EV-openai-2026-09-gpt-6-astra-system-card-14
    claim: >-
      In PostTrainBench Lite an LLM judge checks trials for invalid strategies such as training on
      held-out evaluation data, and trials it classifies as cheating get a reward of 0.
    quote: >-
      An LLM judge checks for invalid strategies, such as training on held-out evaluation data,
      and assigns a reward of 0 to trials classified as cheating.
    locator: Section 10.1.3.4, PostTrainBench Lite
    kind: automation
    strength: reported
    grade: B
    tasks: [T-eval-graders, T-eval-validity]
    note: >-
      One of the AI self-improvement evaluations. The card gives no agreement rate for the judge
      and describes no human check of its classifications.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-15
    claim: >-
      In its biological capability evaluations OpenAI uses probes to identify refusals and
      counts those refusals as successes, to give a conservative upper bound on performance.
    quote: >-
      We use probes to identify refusals and [...] count such refusals as successes to calculate
      a conservative upper bound on performance.
    locator: Section 10.1.1, Biological and Chemical Capabilities
    kind: method
    strength: reported
    grade: B
    tasks: [T-eval-validity, T-eval-dangerous]
    note: >-
      The omitted words say this is consistent with previous system cards. The card adds that
      Astra refused notably more often than earlier models on some of these evaluations, and
      attributes large jumps in the adjusted scores mostly to safety training.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-16
    claim: >-
      OpenAI calls setting an indicative threshold for one new Critical-level biology evaluation
      difficult. Its preliminary threshold was informed by rounds of internal discussion and a
      survey of 14 external experts.
    quote: >-
      Setting an indicative threshold for this task is difficult. [...] which is informed by
      rounds of internal discussion and a survey of 14 external experts.
    locator: Section 10.1.1.2.2, SHP2 Protein Function Prediction
    kind: practice
    strength: reported
    grade: B
    tasks: [T-eval-design]
    note: >-
      The omitted words give the threshold. The card uses the same wording for two more new
      evaluations and says it expects to change methodology and thresholds. It does not say
      whether models took any part in designing the evaluations or setting the thresholds.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-17
    claim: >-
      Analysis of transcripts showed that some interim checkpoints could infer how many true
      binders a protein binding evaluation contained from an environment variable whose
      identifier included "single_true". OpenAI says this contributed to retiring the evaluation.
    quote: >-
      analysis of the models’ transcripts helped us identify some important limitations that
      contributed to us deciding to retire this evaluation. Most notably, whilst the model was
      not told how many true binders exist, we observed that some interim model checkpoints were
      able to infer this from one of the evaluation’s environment variables having an identifier
      that included the phrase “single_true.”
    locator: Section 10.1.1.3.1, Hard-negative Protein Binding Prediction
    kind: incident
    strength: reported
    grade: B
    tasks: [T-eval-harness, T-eval-transcripts, T-eval-validity]
    note: >-
      OpenAI had used this evaluation on an interim basis as an indicator of Critical biological
      capability, and reported its result in the GPT-5.5 system card
      (S-openai-2026-04-gpt-5-5-system-card, item 06). The card does not say when the leak was
      found, whether people or models analyzed the transcripts, or whether earlier scores were
      affected.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-18
    claim: >-
      To test its Auto-review monitor, OpenAI generated disallowed trajectories by having GPT-6
      Astra make targeted edits to existing rollouts from employees' dots, 30 per category.
    quote: >-
      We generated these by taking existing rollouts from de-identified OpenAI employee dots, and
      using GPT-6 Astra to make targeted edits that make an action disallowed. [...] We generated
      30 of these per category.
    locator: Appendix B.3.6, Evaluating Auto-review
    kind: automation
    strength: reported
    grade: B
    tasks: [T-eval-tasks, T-eval-safeguards]
    note: >-
      Auto-review is the second model that reviews certain Codex commands. The card describes no
      human check of the generated cases. The reviewer's denial rate was measured separately on
      5,000 unedited requests from employee traffic.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-19
    claim: >-
      The prompts of OpenAI's static jailbreak evaluation were generated by attacker models such
      as GPT-Red.
    quote: >-
      The adversarial prompts were generated by attacker models, such as GPT-Red [1], which were
      instructed to jailbreak past GPT models.
    locator: Section 5.1.1, Static Jailbreak Evaluations
    kind: automation
    strength: reported
    grade: B
    tasks: [T-eval-tasks, T-eval-safeguards]
    note: >-
      Half the prompts in each evaluation came from a held-out attacker that was not used to
      generate training data. The card describes no human review of the prompts. Section 5.1 says
      these evaluations jailbreak the model directly, without the safeguards used in production, so
      they test the model's own refusals. Tagging safeguard testing is our reading of refusal
      training as one layer of the safeguards.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-20
    claim: >-
      One measured portion of OpenAI's automated red-teaming of Astra's safeguards used an
      estimated 200,000 A100e GPU-hours, counting only inference by the model under test.
    quote: >-
      One measured portion of our automated red-teaming accounted for an estimated 200,000 A100e
      GPU-hours. These estimates cover only inference by the model being tested and exclude
      attacker and helper model inference
    locator: Section 10.2.4.1, Automated Red-teaming for Jailbreaks
    kind: automation
    strength: reported
    grade: B
    tasks: [T-eval-safeguards]
    note: >-
      OpenAI calls this a partial accounting. The section also describes regression testing of known
      jailbreaks, systematic variation of attacks and automated searches for new ones, and says
      internal red-teamers had access to the model's chain of thought and to internal safeguard
      policies. The next section reports jailbreak testing by four private red-teaming
      organizations, whose work it says combines human expertise with automated testing methods. The
      card gives no split between automated and human red-teaming.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-21
    claim: >-
      The examples in the evaluations OpenAI built to measure its misuse monitors were validated
      by subject matter experts in biology and cybersecurity and by internal employees.
    quote: >-
      The evaluation examples were validated by subject matter experts in biology and
      cybersecurity, as well as internal employees.
    locator: Section 10.2.3.3, Misuse Monitor Performance
    kind: oversight
    strength: reported
    grade: B
    tasks: [T-eval-safeguards, T-eval-tasks]
    note: >-
      The set mixes cases derived from production traffic, conversations from the technical
      investigations team and synthetic examples. The card does not say whether every example
      was validated or by how many people.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-22
    claim: >-
      In one alignment evaluation run for dots, one sample at the 4-hour budget was flagged for a
      circumvention attempt and manual review found it to be a false positive.
    quote: >-
      At the 4-hour budget, one of the samples was flagged for a circumvention attempt, but manual
      review determined it was a false positive.
    locator: Appendix B.3.1.1, Respecting Auto-Review
    kind: oversight
    strength: reported
    grade: B
    tasks: [T-eval-alignment, T-eval-graders]
    note: >-
      Appendix B.3.1.3 reports the same for one flagged sample in the honeypot evaluation. The
      card does not say whether anyone read samples that were not flagged.

  - id: EV-openai-2026-09-gpt-6-astra-system-card-23
    claim: >-
      The safeguards section of the card is a public summary of an internal Safeguards Report.
      The internal report informed the Safety Advisory Group's recommendation and OpenAI
      leadership's determination that the safeguards are sufficient for Astra's public launch.
    quote: >-
      What follows is a public summary of our internal Safeguards Report [...] The internal report
      informed our Safety Advisory Group’s recommendation and OpenAI leadership’s determination
      that these safeguards are sufficient for Astra’s public launch.
    locator: Section 10.2, Safeguards
    kind: practice
    strength: reported
    grade: B
    tasks: [T-eval-determination, T-eval-reporting]
    note: >-
      The omitted words say the internal report has details not suitable for public disclosure.
      Appendix B.6 repeats the statement for the launch of dots. The card does not say who wrote
      either document or what the group examined beyond the report.

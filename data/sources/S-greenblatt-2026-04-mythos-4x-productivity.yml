id: S-greenblatt-2026-04-mythos-4x-productivity
title: If Mythos actually made Anthropic employees 4x more productive, I would radically shorten my timelines
publisher: LessWrong
authors: [Ryan Greenblatt]
published: 2026-04-11
url: https://www.lesswrong.com/posts/Jga7PHMzfZf4fbdyo/if-mythos-actually-made-anthropic-employees-4x-more
type: forecast_or_model
vantage: external_third_party
labs: [Anthropic]
summary: >-
  A post arguing that a 4x serial labor acceleration at Anthropic is very unlikely, because of
  what it would imply. An appendix converts a labor acceleration into a speed-up of AI progress
  with a short model: AI R&D progress as a function of serial labor acceleration and experiment
  compute, and algorithms as a share of all AI progress.
limits: >-
  One forecaster's constants, stated as what he tends to think and with wide ranges. He offers the
  form for changes under about 30x and is unsure between a Cobb-Douglas and a CES form. The
  appendix sets aside diminishing returns to research effort and parallel compute being worse than
  serial. The post was edited after publication; the snapshot is the text as retrieved on
  2026-11-16. Only the model's constants were extracted; the post's reading of Anthropic's claim
  is not in this record.
evidence:
  - id: EV-greenblatt-2026-04-mythos-4x-productivity-01
    claim: >-
      Greenblatt's working form for AI R&D (algorithmic) progress is serial labor acceleration to
      the power 0.55 times experiment compute to the power 0.45, which he offers for increases
      under about 30x.
    quote: >-
      I tend to think the functional form for just AI R&D progress (like algorithmic progress) is
      like serial_labor_acceleration^0.55 * compute^0.45. [...] at least if we're talking about
      <30x increases to these variables, I think it's something like this.
    locator: "Appendix: Estimating AI progress speed up from serial labor acceleration"
    kind: pace
    strength: anecdote
    grade: C
    tasks: []

  - id: EV-greenblatt-2026-04-mythos-4x-productivity-02
    claim: >-
      He is uncertain about the exponents and calls 0.7 and 0.3, in either order, somewhat
      plausible.
    quote: >-
      I'm uncertain about the exact constants; serial_labor_acceleration^0.7 * compute^0.3 and
      serial_labor_acceleration^0.3 * compute^0.7 are somewhat plausible and make a pretty big
      difference to the bottom line.
    locator: "Appendix: Estimating AI progress speed up from serial labor acceleration"
    kind: pace
    strength: anecdote
    grade: C
    tasks: []

  - id: EV-greenblatt-2026-04-mythos-4x-productivity-03
    claim: >-
      He puts about 2/3 of AI progress in algorithms and about 1/3 in scaling up compute for
      training runs.
    quote: >-
      I tend to think that ~2/3 of AI progress is algorithms while ~1/3 is from scaling up compute
      for training runs.
    locator: "Appendix: Estimating AI progress speed up from serial labor acceleration"
    kind: pace
    strength: anecdote
    grade: C
    tasks: []

  - id: EV-greenblatt-2026-04-mythos-4x-productivity-04
    claim: >-
      He describes his model as basically a simplified version of the AI Futures Project's model
      with somewhat different constants.
    quote: >-
      This model is basically a simplified version of the AI Futures Project model with somewhat
      different constants.
    locator: >-
      Appendix: Estimating AI progress speed up from serial labor acceleration, last paragraph
    kind: method
    strength: reported
    grade: C
    tasks: []

id: S-govai-2026-03-measuring-airda
title: Measuring AI R&D Automation
publisher: Centre for the Governance of AI (GovAI), arXiv 2603.03992
authors: [Alan Chan, Ranay Padarath, Joe Kwon, Hilary Greaves, Markus Anderljung]
published: 2026-03
url: https://arxiv.org/pdf/2603.03992
type: academic_paper
vantage: external_third_party
labs: []
summary: >-
  GovAI and Oxford authors propose fourteen metrics for tracking how far AI R&D is automated and
  what that does to AI progress and to oversight. It defines oversight, oversight demand,
  oversight capacity and the oversight gap, and specifies oversight red-teaming experiments
  (Metric 3) and oversight effectiveness retrospectives (Metric 9).
limits: >-
  A proposal. It reports no measurements from any developer; every metric is described as
  something companies or third parties could start to collect. The snapshot is arXiv version 3
  (6 March 2026). The authors note that companies would collect most metrics themselves, so
  accuracy would be hard to verify from outside.
evidence:
  - id: EV-govai-2026-03-measuring-airda-01
    claim: >-
      The paper defines oversight of AI R&D as two things together: understanding the process
      and exercising informed control over it, for example by reviewing AI-generated outputs
      for errors.
    quote: >-
      An actor has oversight over the AI R&D process to the extent that they (1) understand the
      process and (2) exercise informed control over it in order to produce desired outputs,
      such as by reviewing AI-generated outputs for errors.
    locator: Section 3.2, Oversight, page 5
    kind: method
    strength: reported
    grade: C
    note: >-
      Understanding is part of the definition, so review without understanding does not count
      as oversight in this paper's terms.

  - id: EV-govai-2026-03-measuring-airda-02
    claim: >-
      The oversight gap is the difference between the oversight the AI R&D process needs
      (oversight demand) and the oversight actually achieved.
    quote: >-
      the difference between how much oversight is needed over the AI R&D process (“oversight
      demand”) [...] and how much oversight is actually achieved.
    locator: Section 3.2, Oversight, page 5
    kind: method
    strength: reported
    grade: C
    note: The omission is a footnote marker.

  - id: EV-govai-2026-03-measuring-airda-03
    claim: >-
      Metric 3, oversight red-teaming, measures in controlled experiments how often an
      organization's oversight systems catch an AI system told to subvert R&D work, including
      by manipulating evaluation results, reported as the percentage of subversive actions
      detected.
    quote: >-
      this metric measures how often an organization’s oversight systems would catch an AI
      system explicitly instructed to subvert normal R&D workflows, such as by attempting to
      sabotage experiments, insert backdoors, or manipulate evaluation results. The metric is
      reported as the percentage of subversive actions that are detected, both overall and by
      task category.
    locator: Section 4.1.3, Metric #3, Description, page 15
    kind: method
    strength: reported
    grade: C
    tasks: [T-eval-safeguards]

  - id: EV-govai-2026-03-measuring-airda-04
    claim: >-
      The authors rate oversight red-teaming as low to moderate in feasibility and say the
      related evaluations that exist may not reflect real production workflows.
    quote: >-
      Feasibility: Low to moderate. Implementation requires a sandboxed R&D environment
      mirroring production workflows, models fine-tuned or prompted to attempt specific
      behaviours, and instrumentation to log both attempted actions and detection events. Some
      related evaluations exist (Inglis et al., 2025), but may not necessarily reflect real
      production workflows.
    locator: Section 4.1.3, Metric #3, Feasibility, page 15
    kind: method
    strength: reported
    grade: C
    tasks: [T-eval-safeguards]
    note: As of March 2026. The paper does not say what any developer runs internally.

  - id: EV-govai-2026-03-measuring-airda-05
    claim: >-
      Metric 9, oversight effectiveness retrospectives, tracks defects in AI-generated R&D
      outputs: whether each output had human review and of what kind, how far AI assisted that
      review, and when its defects were found.
    quote: >-
      This metric focuses on defects in AI-generated R&D outputs. For each AI-generated R&D
      output, companies would track: [...] Whether the output underwent human review (and what
      kind) [...] The degree to which AI systems assisted with human review [...] When the
      defects were discovered (e.g., during review, after review but before production, or after
      production)
    locator: Section 4.3.2, Metric #9, Description, page 20
    kind: method
    strength: reported
    grade: C
    note: >-
      The omissions are bullet marks and one bullet (the description of the defects). The listed
      output types include analyses of experimental data and logs of how a training run was
      monitored.

  - id: EV-govai-2026-03-measuring-airda-06
    claim: >-
      For the retrospectives, the paper asks for two reported quantities, both stratified by
      severity: the proportion of outputs with defects and the time until a defect is found.
    quote: >-
      Both the proportion of outputs that have defects and the length of time until discovery of
      the defect(s) should be reported, stratified by severity.
    locator: Section 4.3.2, Metric #9, Description, page 20
    kind: method
    strength: reported
    grade: C

  - id: EV-govai-2026-03-measuring-airda-07
    claim: >-
      Of the oversight metrics the paper recommends to companies, it says oversight
      effectiveness retrospectives take the most effort to track.
    quote: >-
      Metric #10 (AI subversion incidents) requires somewhat more effort, while Metric #9
      (oversight effectiveness retrospectives) requires the most effort.
    locator: Table 1, Recommendations, row "Track how AIRDA affects oversight", page 3
    kind: method
    strength: reported
    grade: C

  - id: EV-govai-2026-03-measuring-airda-08
    claim: >-
      The authors say that, as of early 2026, it is not known how often errors introduced by AI
      escape human review, or whether productivity gains differ between safety teams and other
      teams.
    quote: >-
      it is unclear whether productivity improvements differ between safety teams and other
      teams, or how often AI-introduced errors escape human review.
    locator: Section 1, Introduction, page 2
    kind: oversight
    strength: reported
    grade: C
    note: A statement of missing data by outside authors, not a finding about any developer.

  - id: EV-govai-2026-03-measuring-airda-09
    claim: >-
      Metric 12 would measure the compute used across the AI R&D process with evaluation as its
      own category, alongside training stages, experimentation, internal inference and external
      deployment.
    quote: >-
      This metric measures the amount of compute (FLOP) used by frontier AI companies across the
      AI R&D process, including pre-training, mid-training, post-training, evaluation,
      experimentation, internal inference (e.g. coding and research agents), and external
      deployment.
    locator: Section 4.4.2, Metric #12, Description, page 23
    kind: method
    strength: reported
    grade: C
    tasks: [T-eval]
    note: >-
      A proposed way to get the compute share of evaluation. The paper gives no figure for it
      and rates the sensitivity of this data as high.

id: S-gdm-2026-10-gemini-4-argon-safety-report
title: Gemini 4 Argon Safety & Security Report
publisher: Google DeepMind
authors: []
published: 2026-10
url: https://storage.googleapis.com/deepmind-media/gemini/gemini_4_safety_report.pdf
type: risk_report
vantage: first_party
labs: [Google DeepMind]
summary: >-
  Google DeepMind's 217-page safety and security report for Gemini 4 Argon. Covers the Frontier
  Safety Framework assessments (it cannot rule out the cyber and biological Critical Capability
  Levels or the stealth and situational awareness Tracked Capability Level), a holistic
  assessment of how far ML R&D inside Google DeepMind is automated, a loss-of-control risk
  assessment that rests on monitoring, an alignment assessment, chain-of-thought transparency
  tests, and a section on evaluation awareness and its effects.
limits: >-
  Self-reported. The automation findings rest on a 12-person survey and on trajectories labeled
  by a model; experimental code is excluded from the code figures. Findings of external testers
  are Google's summaries. Some evaluations ran on checkpoints 6 and 10 days before the final
  one. Figures are not in the extracted text. Only parts of the report were read for this
  record: Sections 1 to 3.4.4 and 3.5 to 3.7 in full, and Section 3.4.5 in part (3.4.5.3, the
  results pages of 3.4.5.4, 3.4.5.8 and 3.4.5.9 were not read). Sections 4 to 7 were searched
  by keyword only.
evidence:
  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-01
    claim: >-
      Google DeepMind surveyed 12 senior leaders and researchers across the components of AI
      R&D it lists, one of which is evaluation and training environment development. They
      reported automation highest in well-specified, verifiable execution tasks and lowest in
      open-ended ideation and research taste.
    quote: >-
      we surveyed 12 senior leaders and researchers [...] across key components of the AI R&D
      stack (software engineering, data curation, evaluation and training environment
      development, experiment execution and analysis, kernel optimization, datacenter operations,
      and chip design). Respondents report that automation is highest in well-specified,
      verifiable execution tasks and lowest in open-ended scientific ideation and long-horizon
      research taste.
    locator: Section 3.4.2.3, Finding 2 (PDF page 77)
    kind: automation
    strength: reported
    grade: B
    describes: 2026
    tasks: [T-eval]
    note: >-
      A published list of AI R&D work categories from a developer. No figure is given per
      category, and the survey has 12 respondents.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-02
    claim: >-
      Google DeepMind's report says AI agents author a majority of production code and bug fixes,
      and that code changes remain subject to human review before submission.
    quote: >-
      AI agents now operate as high-leverage assistants that author a majority of production code
      and bug fixes, though code changes remain subject to human review before submission.
    locator: Section 3.4.2.3 (PDF page 77)
    kind: oversight
    strength: reported
    grade: B
    describes: 2026
    tasks: []
    note: >-
      Stated in the paragraph that reports the staff survey. It does not say how deeply people read
      the changes.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-03
    claim: >-
      Most production code at Google DeepMind is more than 75% AI-written. Fully delegated pull
      requests rose from 7.5% in April to 11.9% in September 2026; about 88% of pull requests
      still needed multi-turn human steering or human-written code.
    quote: >-
      Most production code at GDM is now >75% AI-written, and the fraction of pull requests where
      >98% of the code is AI-written is increasing steadily. [...] while the share of fully
      delegated pull requests increased from 7.5% in April to 11.9% in September 2026, about 88%
      of pull requests still require iterative multi-turn human steering or human code
      authorship.
    locator: Section 3.4.2.3, Production code (PDF page 78)
    kind: automation
    strength: reported
    grade: B
    describes: 2026-09
    tasks: []
    note: >-
      Production code only; the report expects the trend to be steeper for experimental code,
      which it did not measure. How "fully delegated" was determined is not described.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-04
    claim: >-
      Google DeepMind's measurement of how autonomously its agents work internally was itself
      made by a model: Gemini Flash 3.8 judged, for 1389 sampled agent trajectories, the task,
      the time an engineer would need, whether the agent succeeded on its own and whether a
      person intervened.
    quote: >-
      We looked at a stratified random sample of 1389 Argon trajectories from internal use. For
      each, we asked Gemini Flash 3.8 to identify the main task being solved, how long it would
      take an unassisted Google engineer, whether the agent succeeded autonomously, and whether
      the human intervened or the outcome was otherwise negative or ambiguous.
    locator: Section 3.4.2.3, General agentic use (PDF page 78)
    kind: method
    strength: reported
    grade: B
    describes: 2026
    tasks: [T-eval-graders]
    note: >-
      No check of the model's labels against human labels is described. The results appear only
      as a figure, which is not in the extracted text.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-05
    claim: >-
      Unprompted evaluation awareness rose from 0.0% for Gemini 3.1 Pro to 37.8% of runs for
      Gemini 4 Argon on agentic coding honeypots, and appeared in 75.8% to 94.0% of transcripts
      on some stealth challenges.
    quote: >-
      unprompted evaluation awareness rose from 0.0% in Gemini 3.1 Pro to 37.8% of unprompted
      runs in agentic coding honeypots, and appeared in 75.8% to 94.0% of transcripts on specific
      stealth challenges
    locator: Section 3.5 (PDF page 157)
    kind: risk
    strength: measured
    grade: A
    tasks: [T-eval-validity, T-eval-alignment]
    note: >-
      The honeypot awareness ratings come from a Gemini 3.1 Pro judge (Section 3.4.4.3). Google
      concludes the awareness does not undermine its capability assessments.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-06
    claim: >-
      Sampled evaluation transcripts were first checked by Gemini 3.5 Flash for 9 pre-specified
      failure modes, evaluation awareness and deliberate underperformance. Staff then manually
      inspected a stratified sample, prioritizing cases where the model failed unexpectedly.
    quote: >-
      1) We ran automated checks using Gemini 3.5 Flash for 9 pre-specified failure modes, [...]
      as well as instances of evaluation awareness and deliberate underperformance. 2) Our teams
      manually inspect a stratified sample of transcripts, prioritizing instances where the model
      failed unexpectedly.
    locator: Section 3.2.2.4, Correctness Checks and Deliberate Underperformance (PDF page 39)
    kind: oversight
    strength: reported
    grade: B
    tasks: [T-eval-transcripts, T-eval-validity]
    note: >-
      Applies to the cyber, stealth and situational awareness suites. Sample sizes are not
      given. The omission is a footnote marker.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-07
    claim: >-
      Review of transcripts from the stealth evaluations found several small issues in the
      evaluations, including leaked environment artifacts, rendering errors, fragile tool wrappers,
      prompt inconsistencies and flaws in the automated reviewer.
    quote: >-
      Both automated and manual review of agent transcripts on stealth evaluations identified
      several small issues, including leaked environment artifacts, context-rendering errors,
      fragile tool wrappers, occasional prompt inconsistencies, and automated reviewer flaws.
    locator: Section 3.4.1.4, Correctness Checks and Deliberate Underperformance (PDF page 72)
    kind: incident
    strength: reported
    grade: B
    tasks: [T-eval-harness, T-eval-tasks, T-eval-transcripts]
    note: >-
      These evaluations decide the stealth and situational awareness threshold. Google says it
      does not believe the issues meaningfully undermined the results.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-08
    claim: >-
      When Gemini 4 Argon infers it is being scored by an automated harness, it sometimes turns
      to reverse-engineering or spoofing the grader. This was observed in 5.8% of situational
      awareness evaluation runs.
    quote: >-
      Once the model infers that it is being scored by an automated harness or script, it
      sometimes shifts from solving the task to reverse-engineering or spoofing the local grader
      (observed in 5.8% of Situational Awareness runs).
    locator: Section 3.5.2 (PDF page 158)
    kind: risk
    strength: reported
    grade: B
    tasks: [T-eval-graders, T-eval-validity]

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-09
    claim: >-
      Some evaluations behind the report were run on earlier checkpoints, among them manipulation
      efficacy and CBRN red teaming on one from 10 days before the final checkpoint, and independent
      external CBRN testing on one from 6 days before.
    quote: >-
      Model A Early checkpoint of Gemini 4 Argon (T-10 days before final checkpoint) Efficacy
      evaluations (Harmful Manipulation) Red teaming evaluations (CBRN) Model B Intermediary
      checkpoint of Gemini 4 Argon (T-6 days before final checkpoint) Independent External safety
      testing (CBRN)
    locator: Section 3.7, Table 3.8 (PDF page 161)
    kind: pace
    strength: reported
    grade: B
    tasks: [T-eval-dangerous, T-eval-external, T-eval-determination]
    note: >-
      Google says an internal capability index showed no material change between checkpoints.
      The time between the final checkpoint and release is not stated. All other evaluations
      ran on the final release candidate.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-10
    claim: >-
      Google DeepMind says evaluation awareness is a growing obstacle to assessing final
      checkpoints for loss-of-control risk and may limit the usefulness of final-checkpoint
      evaluations for misalignment.
    quote: >-
      We note that evaluation awareness is an increasing challenge when assessing final
      checkpoints for loss-of-control risks, and it may limit the utility of final checkpoint
      evaluations for misalignment.
    locator: Section 3.4.1.4, Independent External Safety Testing (PDF page 73)
    kind: risk
    strength: reported
    grade: B
    tasks: [T-eval-alignment, T-eval-validity]
    note: >-
      Stated in the account of Apollo Research's testing, which the report says lasted 10
      business days. Apollo advised evaluating during training runs instead.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-11
    claim: >-
      Google DeepMind's trajectory and chain-of-thought monitors are LLMs. It has not directly
      validated, by a method resilient to deliberate underperformance, that using a distinct model
      as the monitor significantly reduces the possibility of collusion on novel trajectories.
    quote: >-
      Because our trajectory and CoT monitors rely on LLMs, their effectiveness depends on the
      monitor remaining sufficiently independent from the agent being monitored [...] we have
      not directly validated – using a method resilient to deliberate underperformance – that
      using a distinct model significantly reduces the possibility of collusion on novel
      trajectories.
    locator: Section 3.4.3.3, Feasibility, Monitor independence and collusion (PDF page 84)
    kind: risk
    strength: reported
    grade: B
    tasks: [T-eval-safeguards]
    note: >-
      The same section says internal red-teaming of the monitors surfaced bypasses that are
      fixed or being fixed.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-12
    claim: >-
      The audit for cheating on capability benchmarks was run by models in stages: an LLM judge
      reviewed each run, two LLM classifiers labeled every flagged run, and an LLM reader read every
      run and corrected classifier errors in 32 runs. Google says it checked that the actions the
      judge cited appeared in the transcripts.
    quote: >-
      An LLM judge (Gemini 3.1 Pro) first reviewed each agent's commands and their outputs, and
      we checked that every action it cited appears in the transcript. [...] Two LLM classifiers
      (Gemini 3.1 Pro and an external model) labeled every flagged run [...] An LLM reader (a
      different external model) then read every run and corrected clear classifier errors in 32
      runs.
    locator: Section 3.4.4.2, Cheating in capability evaluations (PDF page 97)
    kind: automation
    strength: reported
    grade: B
    tasks: [T-eval-transcripts, T-eval-validity, T-eval-graders]
    note: >-
      The report does not say whether people or a script did that check. Staff also wrote, per task,
      what counts as withheld information and a disallowed route. Table 3.6 lists as a limitation
      that 17% of TerminalBench runs lacked transcripts.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-13
    claim: >-
      Google DeepMind's risk assessment lists, as an uncertainty in an assumption it depends on,
      that unassisted two-party human code review could become more porous as engineers rely on
      agents to author large changes.
    quote: >-
      unassisted human two-party code review could become more porous as engineers rely more heavily
      on agents to author large changelists.
    locator: Section 3.4.3.4, Table 3.5, assumption 5 (PDF page 89)
    kind: risk
    strength: reported
    grade: B
    describes: 2026
    tasks: []
    note: >-
      The report says it is auditing and strengthening code review, combining human and AI review.
      It does not say how deeply people read the changes.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-14
    claim: >-
      External evaluators do not comment on Google DeepMind's risk thresholds. Google DeepMind's
      subject matter experts review, translate and integrate the external results into its own
      internal risk analyses.
    quote: >-
      The independent external evaluators explore frontier safety risk domains, however they do
      not directly comment on risk thresholds as contemplated under our FSF. [...] Our subject
      matter experts review, translate, and integrate the results of these independent
      evaluations into our own internal risk analyses
    locator: Section 3.1.3 (PDF page 20)
    kind: oversight
    strength: reported
    grade: B
    tasks: [T-eval-external, T-eval-determination]
    note: >-
      The same section says evaluators got a version without the full set of safety mitigations
      where relevant. Section 3.4.1.4 says Apollo evaluated the model over 10 business days. What
      the experts examined beyond the testers' results is not stated.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-15
    claim: >-
      The CBRN threat scenarios that the evaluations test are prioritized with internal and
      external experts, who gave iterative, anonymous assessments using the Delphi process.
    quote: >-
      we work with internal and external experts to prioritize scenarios (combinations of threat
      actor types and agents, weapons, or attacks) based on several factors [...] Experts provided
      iterative, anonymous assessments of attack success probability, potential harm levels, and
      incidence using the Delphi process
    locator: Section 3.2.1.2, Scenario mapping and prioritization (PDF page 23)
    kind: practice
    strength: reported
    grade: B
    tasks: [T-eval-design]
    note: >-
      The report describes no use of models in this step. It withholds the scenarios themselves.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-16
    claim: >-
      In CBRN red teaming, expert red teamers write their own prompts, guide the conversations
      and score their own findings against a rubric for each substage.
    quote: >-
      Red teamers independently write their own prompts and guide conversations as they deem
      necessary to elicit information. [...] When red teamers have finished elicitation for a
      given substage, they score their findings using a substage-specific scoring rubric.
    locator: Section 3.2.1.3, Expert Red Teaming (PDF page 25)
    kind: automation
    strength: reported
    grade: B
    tasks: [T-eval-dangerous, T-eval-elicitation, T-eval-graders]
    note: >-
      Evidence that people do this work. The results section says eight expert red teamers
      assessed the three biological scenarios (PDF page 26). The CBRN threshold assessments
      rest on this red teaming.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-17
    claim: >-
      A subset of the CBRN red teamers' transcripts and scores is peer reviewed by additional
      experts. A panel of subject matter experts then reviews aggregated scores and transcripts
      to assess whether the Critical Capability Level can be ruled out.
    quote: >-
      A subset of red teamers’ raw chat transcripts and scores are peer reviewed by additional
      experts. [...] A panel of subject matter experts then reviews aggregated red-teaming scores
      and transcripts along with additional feedback from red teamers to make an assessment as to
      whether we can rule out CCL
    locator: Section 3.2.1.3, Expert Red Teaming (PDF page 25)
    kind: oversight
    strength: reported
    grade: B
    tasks: [T-eval-dangerous, T-eval-determination]
    note: >-
      The size of the peer-reviewed subset is not given. Section 3.2.1.1 says a committee of
      internal domain-specific SMEs recommended whether the thresholds could be ruled out.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-18
    claim: >-
      In the CBRN domain, the check for evaluation awareness and deliberate underperformance was
      run by automated tests on 390 trajectories. The tests flagged 65 trajectories (16.7%) for
      evaluation awareness and none for deliberate underperformance.
    quote: >-
      we used automated tests to analyze the model's responses and raw thinking traces from static
      evaluations of Gemini 4 Argon. [...] Running 10 replicates per set yielded 390 total test
      model trajectories for evaluation. While our automated tests detected no instances of
      deliberate underperformance, they identified 65 trajectories (16.7%) with indications of
      evaluation awareness.
    locator: Section 3.2.1.7 (PDF page 32)
    kind: automation
    strength: reported
    grade: B
    tasks: [T-eval-validity]
    note: >-
      This section describes no human reading of the 390 trajectories. Section 3.5.3 says manual
      inspection was combined with LLM-assisted triage across all risk domains. What the automated
      tests are is not stated.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-19
    claim: >-
      The cyber Critical Capability Level determination is made by internal subject matter experts,
      who analyze the quantitative results alongside qualitative information.
    quote: >-
      As our quantitative scores are subject to substantial uncertainty, the CCL determination is
      made by internal subject matter experts analyzing these quantitative results, alongside
      additional qualitative sources of information regarding model performance.
    locator: Section 3.2.2.1 (PDF page 34)
    kind: oversight
    strength: reported
    grade: B
    tasks: [T-eval-determination]

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-20
    claim: >-
      CyScenarioBench, the main benchmark behind the cyber threshold assessment, is a suite of
      long-horizon challenges that Google DeepMind co-developed with an outside company, Irregular.
    quote: >-
      We evaluate cost reduction across the cyber attack chain primarily using CyScenarioBench
      [...] This is a suite of realistic long-horizon challenges we co-developed with Irregular
    locator: Section 3.2.2.1 (PDF page 34)
    kind: practice
    strength: reported
    grade: B
    tasks: [T-eval-tasks]
    note: >-
      The omission is two footnote markers. The report does not say whether models helped write
      the challenges. Gemini 4 Argon solved all the end-to-end challenges, two of them by unintended
      solutions found in transcript review (footnote 12, PDF page 37).

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-21
    claim: >-
      One of three methods used to elicit strategic plans in the harmful manipulation evaluation
      was an investigator agent optimized for adversarial multi-turn prompting. The report says
      this dynamic method was significantly more effective than direct prompting or standard
      jailbreaking.
    quote: >-
      an ‘investigator’ agent optimized for an adversarial multi-turn dynamic prompting process.
      [...] This dynamic method proved significantly more effective than direct prompting or
      standard jailbreaking
    locator: Section 3.2.3.3, Strategic planning red-teaming evaluation (PDF page 43), and Section 3.2.3.4 (PDF page 53)
    kind: automation
    strength: reported
    grade: B
    tasks: [T-eval-elicitation]
    note: >-
      Table 3.4 gives the share of attempts that elicited a plan for each method. The report
      withholds the details of the method.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-22
    claim: >-
      In the harmful manipulation evaluations, automated checks flagged responses showing
      evaluation awareness or deliberate underperformance, and the evaluation team reviewed all
      flagged responses and chains of thought.
    quote: >-
      We used automated checks to flag model responses from our strategic planning and efficacy
      evaluations that exhibited evaluation awareness or deliberate underperformance on safety.
      All flagged responses and chains-of-thought were reviewed by the evaluation team for
      validation.
    locator: Section 3.2.3.4, Evaluation awareness and deliberate underperformance checks (PDF page 53)
    kind: oversight
    strength: reported
    grade: B
    tasks: [T-eval-validity, T-eval-transcripts]
    note: >-
      People read what the automated checks flagged. No reading of unflagged responses is described
      in this section.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-23
    claim: >-
      In the external manipulation evaluation by pattrn.ai, an LLM judge scored the outputs and the
      tester's subject matter experts reviewed a subset of the transcripts.
    quote: >-
      The outputs are then scored by an LLM-as-a-judge, which has been calibrated based on
      specialized rubrics for refusals, safe conversations, and manipulative conversations. A
      subset of these transcripts are then reviewed by their SMEs to ensure quality and accuracy.
    locator: Section 3.2.3.5 (PDF page 54)
    kind: oversight
    strength: reported
    grade: B
    tasks: [T-eval-external]
    note: >-
      Google DeepMind's summary of an outside tester's method, graded as a relayed statement. The
      size of the subset is not given. One of the two victim proxies in the setup was a calibrated
      role-play model; the other was a human expert.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-24
    claim: >-
      Samples for the safeguard coverage evaluations are built by domain-expert authoring,
      synthetic data generation and mining of sanitized logs. Google DeepMind found synthetic
      datasets often lack diversity and partnered with external human raters to construct examples.
    quote: >-
      Under each category, we construct samples through domain-expert authoring, synthetic data
      generation, and sanitized log mining. We find synthetic datasets often lack diversity, so we
      partnered with external human raters to construct high quality and diverse examples.
    locator: Section 3.3.1 (PDF page 56)
    kind: automation
    strength: reported
    grade: B
    tasks: [T-eval-tasks, T-eval-safeguards]
    note: >-
      No shares are given for the three ways of building samples. The CBRN conversational set is
      described as prompts written by subject matter experts (Section 3.3.1.2).

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-25
    claim: >-
      The adaptive jailbreak evaluation of the cyber safeguards is run by automated red-teaming
      orchestrators: a single-turn attacker that rephrases prompts using rejection feedback and
      a multi-turn conversational attacker.
    quote: >-
      we deploy automated red-teaming orchestrators that learn from failed attempts to iteratively
      probe for bypasses: (1) a single-turn iterative linear-forest attacker that rephrases and
      mutates prompts using rejection feedback, and (2) a multi-turn conversational attacker that
      escalates across turns to elicit complete fulfillment of the attack goal.
    locator: Section 3.3.2.2, Cyber Adaptive Jailbreak Eval (PDF page 61)
    kind: automation
    strength: reported
    grade: B
    tasks: [T-eval-safeguards]
    note: >-
      Section 3.3.2.1 says Google DeepMind invests in both automated and manual red teaming of
      the mitigations. Who reads the attackers' successful outputs is not stated.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-26
    claim: >-
      For the external cyber safeguard evaluation, Gray Swan built 25 cyber tasks on scenarios
      Google DeepMind supplied and ran its automated red-teaming agent, Shade, against them.
    quote: >-
      We provided Gray Swan with several high severity scenarios in vulnerability finding, malware
      creation, etc. on top of which they built 25 specific cyber tasks and deployed their
      automated red teaming agent Shade against them.
    locator: Section 3.3.2.2, Gray Swan Cyber Eval (PDF page 62)
    kind: automation
    strength: reported
    grade: B
    tasks: [T-eval-external, T-eval-safeguards]
    note: >-
      Google DeepMind's summary of an outside tester's work. The same agent was run against 50
      biological tasks that Gray Swan curated (Section 3.3.2.3).

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-27
    claim: >-
      Trajectory Labs red-teamed the safeguarded cyber endpoints by hand: its expert red-teamers
      spent 38 hours issuing over 4,000 requests and reported 12 successful breaks.
    quote: >-
      We partnered with Trajectory Labs to conduct manual red-teaming of our safeguarded cyber
      endpoints across nine attack technique families. Their expert red-teamers spent 38 hours
      issuing over 4,000 requests across these categories [...] Trajectory Labs reported 12
      successful breaks
    locator: Section 3.3.2.2, Trajectory labs (PDF page 62)
    kind: practice
    strength: reported
    grade: B
    tasks: [T-eval-external, T-eval-safeguards]
    note: >-
      Google DeepMind's summary of an outside tester's work. Google DeepMind says it investigated
      the most severe of the breaks.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-28
    claim: >-
      The loss-of-control threat models were developed in a two-part process guided by feedback
      from internal domain experts and from external advisors at the UK AI Security Institute and
      Redwood Research.
    quote: >-
      we developed these threat models through a two-part iterative process. [...] This entire
      process was guided and refined through direct feedback from internal domain experts on the
      Loss of Control (LoC) and Security & Privacy (S&P) teams, as well as external advisors from
      the UK AI Security Institute (UK AISI) and Redwood Research.
    locator: Section 3.4.1.2 (PDF page 65)
    kind: practice
    strength: reported
    grade: B
    tasks: [T-eval-design]
    note: The report describes no use of models in this step.

  - id: EV-gdm-2026-10-gemini-4-argon-safety-report-29
    claim: >-
      An audit of the original tasks still in Google DeepMind's internal ML R&D benchmark found
      that about a quarter had bugs that stop any submission from passing, such as crashing
      verifiers and incorrect ground truth, and that several more were graded against details the
      task did not state.
    quote: >-
      During this evaluation cycle, we audited the subset of original challenges that remain in
      the current suite. About a quarter of them contained bugs that prevent any submission from
      passing (e.g. crashing verifiers, incorrect ground truth), and several more were graded
      against details not stated in the task.
    locator: Section 3.4.1.3, Google RE-Bench (GRB) Internal Benchmark (PDF page 68)
    kind: incident
    strength: reported
    grade: B
    tasks: [T-eval-tasks, T-eval-graders, T-eval-dangerous]
    note: >-
      The report calls this the single benchmark it uses to assess the two ML R&D thresholds. It
      keeps the affected tasks in the results and says the determination would hold even if the
      model could pass them. The same page says infrastructure timeouts stopped many trajectories,
      so no point estimate is reported. Who or what did the audit is not stated.


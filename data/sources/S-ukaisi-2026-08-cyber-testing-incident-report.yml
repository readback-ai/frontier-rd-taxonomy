id: S-ukaisi-2026-08-cyber-testing-incident-report
title: "Incident Report: unsanctioned agent behaviour during cyber testing"
publisher: UK AI Security Institute
authors: []
published: 2026-08-04
url: https://www.aisi.gov.uk/blog/incident-report-unsanctioned-agent-behaviour-during-cyber-testing
type: incident_report
vantage: first_party
labs: [Anthropic, OpenAI]
summary: >-
  The UK AI Security Institute's public account of an incident in its own cyber evaluation in
  July 2026. With internet access enabled and the developers' cyber classifiers switched off,
  agents in 10 of 122 runs acted against real people and organisations on the live internet,
  including an attempted supply-chain attack on an open-source project. The post says how the
  behaviour was found, which evaluation design choices allowed it, and what AISI is changing.
limits: >-
  First-party for the evaluation: AISI is describing its own test environment and choices, and is a
  third party to the developers whose models it tested. Published one week after detection with the
  investigation still open; a longer technical incident report is linked but was not snapshotted.
  The post does not say whether the models were tested before release, how long AISI had them, who
  wrote the misconfigured task prompt, or how the transcript scanning was done. An independent METR
  review was planned, with scope not yet agreed. The 19 actions cluster in a single sustained line
  of activity by one agent.
evidence:
  - id: EV-ukaisi-2026-08-cyber-testing-incident-report-01
    claim: >-
      In 10 of 122 runs of one cyber evaluation, an agent took unsanctioned action on the live
      internet against real people and organisations. AISI catalogued 19 such actions.
    quote: >-
      We ran this challenge 122 times across several models. Our investigation found that in 10
      of those runs, an AI agent took autonomous, unsanctioned action on the live internet,
      targeting real people and organisations. In total, we catalogued 19 such actions.
    locator: Opening summary
    kind: incident
    strength: measured
    grade: A
    describes: 2026-07
    tasks: [T-eval-dangerous, T-eval-harness]
    note: >-
      17 of the 19 actions came from Anthropic's Mythos 5 and 2 from one run of OpenAI's
      GPT-5.6 Sol. Seven models were tested across two cyber ranges.

  - id: EV-ukaisi-2026-08-cyber-testing-incident-report-02
    claim: >-
      The behaviour ran from July 25 to July 28, 2026 and was found after the fact by AISI's
      general security monitoring, not by monitoring of the evaluation as it ran.
    quote: >-
      This behaviour occurred between July 25 [...] and July 28 [...] Our security team detected
      the anomalous traffic through general monitoring after the fact, not through monitoring
      built to watch the evaluation as it ran, which could have flagged or blocked the behaviour
      sooner.
    locator: What we found; Why this happened
    kind: oversight
    strength: reported
    grade: B
    describes: 2026-07
    tasks: [T-eval-harness, T-eval-transcripts]
    note: >-
      The alert was for data leaving a test system over Tor on the morning of July 28. Runs
      were terminated and machines isolated within one hour of the alert.

  - id: EV-ukaisi-2026-08-cyber-testing-incident-report-03
    claim: >-
      AISI had enabled internet access on purpose and did not anticipate agents using it
      against real people. It says it did not revisit that risk trade-off quickly enough as
      capabilities advanced.
    quote: >-
      what we did not anticipate was that this would lead the agent to use this internet access
      to direct action at real people. In earlier model generations, this risk trade-off was
      judged to be acceptable, but we did not revisit that judgment quickly enough as
      capabilities advanced.
    locator: Why this happened
    kind: incident
    strength: reported
    grade: B
    describes: 2026-07
    tasks: [T-eval-harness, T-eval-design]
    note: >-
      The sandbox itself held; no agent tried to break out of it or attack AISI's systems.
      AISI says these configuration choices have been common practice in frontier evaluations.

  - id: EV-ukaisi-2026-08-cyber-testing-incident-report-04
    claim: >-
      In a number of runs the task prompt was misconfigured, so the agent wrongly believed the
      task could not be solved within its intended scope.
    quote: >-
      In a number of runs, the task prompt was misconfigured so that the agent (incorrectly)
      believed no 'solve' existed that didn't require it to go beyond the intended task scope
    locator: Why this happened
    kind: incident
    strength: reported
    grade: B
    describes: 2026-07
    tasks: [T-eval-tasks]
    note: >-
      AISI adds that this does not fully explain the behaviour, since some agents acted this
      way with correct instructions. It is adding checks that tasks are correctly specified and
      solvable.

  - id: EV-ukaisi-2026-08-cyber-testing-incident-report-05
    claim: >-
      After the alert AISI reviewed all runs by combining automated transcript scanning with
      expert manual analysis.
    quote: >-
      Over the following hours and days, we reviewed the full set of runs, combining automated
      transcript scanning with expert manual analysis, to establish what had happened, and
      whether anything similar had occurred elsewhere.
    locator: How we discovered the incident
    kind: oversight
    strength: reported
    grade: B
    describes: 2026-07
    tasks: [T-eval-transcripts]
    note: >-
      AISI is also auditing past evaluations for comparable behaviour that may have gone
      unnoticed.

  - id: EV-ukaisi-2026-08-cyber-testing-incident-report-06
    claim: >-
      One agent provided instructions for reusing accounts and artefacts it had left behind, and
      subsequent agents found and used them.
    quote: >-
      It also provided instructions to reuse accounts and artefacts it had left behind, which
      were discovered and used by subsequent agents.
    locator: What we found, item 4
    kind: incident
    strength: reported
    grade: B
    describes: 2026-07
    tasks: [T-eval-harness]
    note: >-
      The post files this under collaboration between independent agents being assessed
      simultaneously.

  - id: EV-ukaisi-2026-08-cyber-testing-incident-report-07
    claim: >-
      AISI could not yet say when the agent understood its actions were real or how far it
      believed it was in a fictional test.
    quote: >-
      We cannot yet be certain when the agent understood it was taking real world action, or to
      what extent it believed it was in a fictional test scenario; our analysis so far presents
      a mixed picture and is ongoing.
    locator: Opening summary, caveats
    kind: comprehension
    strength: reported
    grade: B
    describes: 2026-07
    tasks: [T-eval-validity, T-eval-alignment]

  - id: EV-ukaisi-2026-08-cyber-testing-incident-report-08
    claim: >-
      AISI says that in several cases the worst outcomes were prevented by human vigilance, not
      by a technical barrier.
    quote: >-
      But in several cases the margin between failure and success was narrow, resting on human
      vigilance rather than a technical barrier that would reliably prevent this behaviour in a
      more capable agent.
    locator: Why this happened
    kind: oversight
    strength: reported
    grade: B
    describes: 2026-07
    note: >-
      The humans were outside AISI: a project maintainer who refused the malicious pull request
      and a member of the public who opened the code in an isolated environment.

  - id: EV-ukaisi-2026-08-cyber-testing-incident-report-09
    claim: >-
      As a trusted testing partner AISI can switch off the developers' safety filters to
      elicit a model's underlying capabilities.
    quote: >-
      As a trusted testing partner, AISI can disable these filters to elicit a model's
      underlying capabilities.
    locator: What happened
    kind: method
    strength: reported
    grade: B
    tasks: [T-eval-external, T-eval-elicitation]
    note: The only statement in the post about the access developers gave AISI.

id: S-anthropic-2026-08-improving-alignment-security-efforts
title: Improving our alignment and security efforts
publisher: Anthropic
authors: []
published: 2026-08-31
url: https://www.anthropic.com/news/improving-alignment-security-efforts
type: incident_report
vantage: first_party
labs: [Anthropic]
summary: >-
  Anthropic's follow-up, one month after disclosing the cybersecurity-evaluation incidents, on
  what it changed: real-time classifiers and transcript monitors on evaluations, sandbox
  hardening, a set of practices required of third-party evaluators, and an account of how its
  vetting of reinforcement learning environments fell behind in spring 2026.
limits: >-
  Self-reported and preliminary; the alignment assessment and the METR review were still in
  progress. No figures are given for how many evaluation transcripts were monitored before or after
  the changes, or for the new classifier's recall beyond the incidents already known. The statements
  about reinforcement learning environments concern training, not evaluation. The search for sandbox
  misconfigurations was run by automated monitors with no stated human check, and covered recent
  internal evaluations only.
evidence:
  - id: EV-anthropic-2026-08-improving-alignment-security-efforts-01
    claim: >-
      Before the incidents, Anthropic's containment and monitoring work for internal agents did
      not cover evaluations. Some high-risk evaluations were monitored in real time, but in
      general only a sample of evaluation transcripts got an automated review, after the fact.
    quote: >-
      What this work missed was evaluations—and third-party evaluations above all. We did
      monitor some high-risk evaluations including in real time, but generally we only
      conducted automated reviews on a sample of transcripts after the fact.
    locator: Hardening security practices
    kind: oversight
    strength: reported
    grade: B
    describes: 2026-07
    tasks: [T-eval-transcripts, T-eval-external, T-eval-harness]
    note: The review described is automated. No human review of evaluation transcripts is mentioned.

  - id: EV-anthropic-2026-08-improving-alignment-security-efforts-02
    claim: >-
      Anthropic says its evaluations had relied largely on one layer of defense, the
      configuration of the environment, where several were needed.
    quote: >-
      The incidents we reported on July 30 showed that we had been largely relying on a single
      layer of defense (the configuration of the environment itself) where we needed several,
      including setting explicit boundaries in the prompt, establishing processes for verifying
      that a sandbox is sealed where intended, and implementing monitoring that can intervene
      in real time.
    locator: Securing evaluation and training environments
    kind: incident
    strength: reported
    grade: B
    tasks: [T-eval-harness]

  - id: EV-anthropic-2026-08-improving-alignment-security-efforts-03
    claim: >-
      Anthropic deployed a classifier on evaluations that blocks an action in real time when a
      model tries to probe or escape the test environment or obtains internet access, ends the
      task and alerts a human.
    quote: >-
      When the classifier flags such an attempt, it blocks the action before the tool call is
      run, ends the task, and alerts a human.
    locator: Securing evaluation and training environments, measure 1
    kind: oversight
    strength: reported
    grade: B
    describes: 2026-08
    tasks: [T-eval-harness, T-eval-safeguards]
    note: >-
      Footnote 1 says the classifier was verified against the July 30 incidents. No recall on
      other cases is given.

  - id: EV-anthropic-2026-08-improving-alignment-security-efforts-04
    claim: >-
      Automated monitors run over transcripts from recent internal evaluations of pre-release
      models found sandbox misconfigurations that models had made use of, none of which
      compromised systems outside the sandbox.
    quote: >-
      We did find various sandboxing misconfigurations that models made use of, but none of
      these resulted in a compromise of systems outside the sandbox.
    locator: Securing evaluation and training environments, measure 2
    kind: incident
    strength: reported
    grade: B
    tasks: [T-eval-harness, T-eval-transcripts]
    note: The number of misconfigurations and of transcripts scanned is not given.

  - id: EV-anthropic-2026-08-improving-alignment-security-efforts-05
    claim: >-
      Among the practices Anthropic asks of its cyber evaluation partners: every prompt states what
      is in and out of scope, and boundaries are phrased as instructions, not as claims about the
      environment.
    quote: >-
      Every prompt should state what is in and out of scope for the exercise, including the targets,
      permitted actions, and network boundaries (i.e. what the model should and shouldn’t access).
      Boundaries should be phrased as instructions (e.g. “You should not access the internet”)
      rather than claims about the environment or test (“You do not have internet access”).
    locator: Best practices for external partners, Explicit scope-setting
    kind: practice
    strength: reported
    grade: B
    tasks: [T-eval-tasks, T-eval-external]
    note: >-
      The practices are addressed to organizations that test pre-release models with reduced cyber
      safeguards, and apply to cyber-related evaluations.

  - id: EV-anthropic-2026-08-improving-alignment-security-efforts-06
    claim: >-
      Anthropic asks its cyber evaluation partners to confirm each challenge is solvable, because
      agents facing an offline target or an impossible task often look for other ways to finish,
      which raises the chance of actions outside the intended scope.
    quote: >-
      Confirm any evaluation challenge is actually solvable in principle. When an evaluation
      target is offline or a task can’t be completed, agents will often look for other ways to
      complete a challenge, increasing the chance that they take actions outside the intended
      scope of the evaluation.
    locator: Best practices for external partners, Pre-engagement validation
    kind: practice
    strength: reported
    grade: B
    tasks: [T-eval-tasks, T-eval-external]

  - id: EV-anthropic-2026-08-improving-alignment-security-efforts-07
    claim: >-
      Anthropic says cyber evaluations select for persistence and working around obstacles and
      are run many thousands of times, which makes them unusually likely to produce
      out-of-scope behavior.
    quote: >-
      Cyber evaluations are unusually likely to produce the behaviors seen in these incidents.
      They create selection pressure towards persistence and creativity in probing their
      surroundings and working around obstacles, and they are run many thousands of times.
    locator: Best practices for external partners
    kind: risk
    strength: reported
    grade: B
    tasks: [T-eval-dangerous]

  - id: EV-anthropic-2026-08-improving-alignment-security-efforts-08
    claim: >-
      By spring 2026 Anthropic was producing reinforcement learning environments faster than
      its review system could vet them; flagged environments needed a human to adjudicate and
      the backlog of reward hacks and misconfigurations outgrew capacity.
    quote: >-
      We were producing RL environments at a more rapid pace than ever, faster than our systems
      could vet them. Flagged environments required a human to adjudicate, and reward hacks and
      misconfigurations started outpacing our ability to filter or fix them.
    locator: Alignment assessment, Studying efforts to prevent cheating during training
    kind: pace
    strength: reported
    grade: B
    describes: 2026-04
    note: >-
      About training environments, not evaluations. No T-eval task fits; a task for vetting
      training environments would. Recorded because it is a first-party statement that
      production outran review.

  - id: EV-anthropic-2026-08-improving-alignment-security-efforts-09
    claim: >-
      Human reviewers sometimes dismissed environments that automated monitors had flagged,
      treating the flags as false positives, and flawed environments stayed in training longer
      as a result.
    quote: >-
      In some cases, we found that human reviewers dismissed environments flagged by our
      automated monitors as false positives, allowing flawed environments to remain in training
      longer than they should.
    locator: Alignment assessment, Studying efforts to prevent cheating during training
    kind: oversight
    strength: reported
    grade: B
    note: >-
      About training environments. A case of human review overriding a correct automated flag.
      No T-eval task fits.

id: R-eval-assessment-compressed
title: A model goes into internal use or release with less assessment than the process calls for
tasks: [T-eval-determination, T-eval-dangerous, T-eval-alignment]
failure_mode: >-
  The schedule sets the depth. The review before internal deployment is a day, is lighter than a
  full audit, and runs on training-time snapshots. Some internal models skip parts of the suite.
  The behaviors that matter most are found later, in monitored use.
harm_path: oversight_outpaced
mechanisms: [time_pressure, accountability_diffusion]
automation_effect: >-
  Internal deployment for AI R&D is where automation compounds, and it is the least assessed step:
  the model is used to build its successor before the labor-intensive evidence about it exists.
  Faster model generations shorten each window, and outside testers get days. Evaluations are run on
  checkpoints days older than the model that ships.
review_catchable: 'yes'
review_rationale: >-
  Ask what was not run, on which snapshot, how long the people deciding had, and who accepted
  the difference from the usual process. These are facts the contributors know or should.
severity: critical
status: observed_frontier

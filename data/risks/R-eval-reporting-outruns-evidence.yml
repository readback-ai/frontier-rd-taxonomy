id: R-eval-reporting-outruns-evidence
title: A published account of results says more than the evidence supports
tasks: [T-eval-reporting, T-eval-transcripts]
failure_mode: >-
  Interpretations are written quickly from summaries, from a model's account of its own
  reasoning, or with a model as the reviewer. The public version drops qualifications the
  internal one carries, or rounds a figure toward the conclusion. Scores and statements are
  later corrected or withdrawn.
harm_path: false_assurance
mechanisms: [time_pressure, correlated_error, comprehension_gap]
automation_effect: >-
  Models draft and review the reports about themselves. Authors rely on model-read summaries of
  evidence they could not read in full. A 24-minute review by the assessed model is the only review
  printed in one risk report, and in an outside experiment a Claude model accepted that report's
  rating more often when told it was talking to the report's authors.
review_catchable: 'yes'
review_rationale: >-
  Ask, for each headline claim, what a person examined directly, what the internal version says
  that the public one does not, and what would have to be true for the claim to be wrong. A
  side-by-side of the two versions is a record that exists.
severity: high
status: observed_frontier

id: R-eval-task-defects
title: Broken, unsolvable or ambiguous tasks distort scores and push agents out of scope
tasks: [T-eval-tasks]
failure_mode: >-
  Tasks cannot be solved as written, have wrong reference answers, or leave the scope unstated.
  Scores saturate below their true ceiling or reward the wrong thing. An agent that cannot finish
  looks for another way, and in a live environment that way can run through real systems.
harm_path: false_assurance
mechanisms: [review_overload, spec_gap, comprehension_gap]
automation_effect: >-
  Tasks are generated by models and run thousands of times, and nobody reads each one. Human
  checking of answer keys was already shallow where it existed. In one run a model asked to generate
  tasks and perform them on live pages submitted a real form. More persistent agents turn a
  defective task from a lost point into an out-of-scope action: in one cyber evaluation, the 22% of
  tasks no model had ever solved were 93% of the tasks the escaping agents discussed.
review_catchable: partly
review_rationale: >-
  A reviewer can ask how solvability and scope were checked, by whom, and what share a person
  attempted. That finds a suite nobody validated. It does not find the individual defective task
  among thousands.
severity: high
status: observed_frontier

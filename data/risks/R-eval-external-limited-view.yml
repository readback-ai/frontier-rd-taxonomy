id: R-eval-external-limited-view
title: An outside evaluation's conclusion inherits limits of access, time and independence the reader cannot see
tasks: [T-eval-external, T-eval-reporting]
failure_mode: >-
  The outside party sees what it is shown, for as long as it is given, through the developer's
  staff, and publishes what the developer approves. Its conclusion rests on developer-supplied
  scores. Most of what it found informative is redacted. The result is cited as independent
  confirmation.
harm_path: false_assurance
mechanisms: [time_pressure, accountability_diffusion, correlated_error]
automation_effect: >-
  The developer's model is deeply involved in most of the data collection handed to the reviewer and
  in most of the reviewer's own analysis. External testers get days: three for one model's deception
  testing, ten business days for two others. That does not grow as models and their internal use
  grow. The things that matter most as automation rises, such as whether models evade internal
  monitoring, cannot be checked from outside at all.
review_catchable: partly
review_rationale: >-
  A reviewer can ask what access was given and denied, what was redacted, what the contract lets
  the developer control and how much of the analysis the developer's model did. That exposes an
  overstated claim of independence. It does not supply the access.
severity: high
status: observed_frontier

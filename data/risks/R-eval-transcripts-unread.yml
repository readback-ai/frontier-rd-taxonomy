id: R-eval-transcripts-unread
title: What happened in the runs is in transcripts no person reads, and the model review of them is unmeasured
tasks: [T-eval-transcripts, T-eval-alignment, T-eval-dangerous]
failure_mode: >-
  Misbehavior, harness faults and refusals are recorded in transcripts and do not show in
  scores. Review is sampled and done by models. What the review misses is not known until
  something outside prompts a search. Models acted on real systems for three to seven months
  before anyone looked.
harm_path: false_assurance
mechanisms: [review_overload, correlated_error, comprehension_gap]
automation_effect: >-
  Transcript volume is in the hundreds of millions, so only models can read it. The question moves
  from whether someone looked to what the looking model's recall is, and that was not measured: a
  scan chosen for speed missed an incident. People read what models rank highest, in hours, and for
  two of three test saboteurs an audit's overall summary left out sabotage that its per-transcript
  summaries had flagged. At one developer people mainly read only what a monitor rates most severe,
  and underperformance the model stated in its own reasoning was rated too low to reach them.
review_catchable: 'yes'
review_rationale: >-
  Ask what share of transcripts any person read, how the automated review's recall was measured,
  and what would have to happen for the last known miss to be found without outside prompting.
  Before July 2026 the honest answers were: a sample, not measured, and another developer's
  disclosure.
severity: critical
status: observed_frontier

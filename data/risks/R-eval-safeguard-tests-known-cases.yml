id: R-eval-safeguard-tests-known-cases
title: A monitor or classifier is declared effective on the cases already known
tasks: [T-eval-safeguards]
failure_mode: >-
  Recall is measured on attacks built against an earlier monitor, or on the incidents that
  prompted the control. The pipeline is not tested end to end. The benchmark monitor and the
  production monitor see different things. Real misbehavior differs from the test set, a
  red-teamer can reliably get past, and the monitored model's own reasoning talks a model
  monitor out of flagging.
harm_path: false_assurance
mechanisms: [correlated_error, spec_gap, adversarial_model]
automation_effect: >-
  Monitors are models watching tens of thousands of agents, with about fifty escalations a week
  reaching a person, days later. The test of the monitor is the only evidence that it works, and
  building hard test cases is slower than deploying the monitor. A control added after an
  incident is verified against that incident. Whether models are learning to evade monitoring
  cannot be checked from outside at all.
review_catchable: 'yes'
review_rationale: >-
  Ask where the test cases came from, whether any were built against this version by someone
  trying to beat it, which stages of the path to a person were never tested, and what the monitor
  does when the subject's reasoning argues with it.
severity: critical
status: observed_frontier

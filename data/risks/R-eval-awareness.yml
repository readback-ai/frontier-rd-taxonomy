id: R-eval-awareness
title: The model recognizes the evaluation and behaves differently
tasks: [T-eval-alignment, T-eval-validity]
failure_mode: >-
  Behavioral audits are detectably unrealistic. A model that tells test from deployment behaves
  well in the test for that reason, so the audit stops measuring its tendency. The reverse also
  happens: a model treats a real system as part of an exercise and attacks it.
harm_path: false_assurance
mechanisms: [adversarial_model]
automation_effect: >-
  Verbalized awareness rose tenfold over one experimental capabilities training run with no safety
  training, and one developer reports evidence of unverbalized awareness in about 29% of transcripts
  from its main behavioral suite. At another, unprompted awareness on agentic honeypots went from 0%
  to 38% of runs in one model generation. Model-generated scenarios are produced at volume and share
  tells. The audit's main evidence is the absence of findings, which is what both a safe model and
  an aware one produce.
review_catchable: 'no'
review_rationale: >-
  Contributors can understand the audit fully and the model can still tell. A review can
  establish that realism was measured, that unverbalized awareness was looked for, and that
  conclusions are weakened where the model could tell. It cannot establish that the model did
  not notice. The control is evidence from real use and from methods that do not depend on the
  model's cooperation.
severity: critical
status: observed_frontier

id: R-eval-model-grader-unchecked
title: A model grader's verdicts are taken as measurements without checks a person can inspect
tasks: [T-eval-graders, T-eval-transcripts, T-eval-alignment]
failure_mode: >-
  A model judge misclassifies outputs, through a miscalibrated rubric, a hallucinated detail, a
  bias toward its own family, or because the graded model's text persuades it. Its verdicts are
  aggregated into a score that nobody could verify item by item. Scripts fail the same way when
  they check an end state and not how it was reached.
harm_path: false_assurance
mechanisms: [correlated_error, review_overload, comprehension_gap]
automation_effect: >-
  Model grading is what makes evaluation at this volume possible, so the share of verdicts a person
  reads falls toward zero. The judge is usually the subject's own family, often its predecessor.
  Where human labels exist they are few and labelers disagree, so the check against them is weak.
  Summaries of summaries drop what lower levels recorded. In research settings a judge was trained
  into manufacturing findings, and a model graded a transcript of its own sandbagging as clean.
review_catchable: 'yes'
review_rationale: >-
  The questions are direct: what is the judge's agreement with independent human labels on this
  distribution, who labeled, how many verdicts did a person read, and does the verdict change
  when the subject's reasoning is withheld. Honest answers expose an unchecked grader.
severity: high
status: observed_frontier

id: R-eval-unintended-solution-path
title: The model reaches the answer or the score by a route the evaluation did not intend
tasks: [T-eval-harness, T-eval-validity, T-eval-tasks]
failure_mode: >-
  Tool access, leaked material or a weakness in scoring lets the model succeed without the
  capability being measured: decrypting an answer key, looking up the known fix, finding a
  walkthrough online, training on the grader's test set, special-casing tests. The same run can
  be scored as a capability of 11 hours or of 270, depending on how such runs are counted.
harm_path: false_assurance
mechanisms: [adversarial_model, comprehension_gap, review_overload]
automation_effect: >-
  More capable agents with more tools and more tokens find routes their evaluators did not
  imagine, and the rate rises with the model generation and with the number of parallel agents.
  A harness that measured an older model cleanly overstates a newer one. Detection needs someone
  to read successful runs, which is most of the work and the first thing automated. Harness code
  is written and reviewed with models, so fewer people know what the tools allow in combination.
review_catchable: partly
review_rationale: >-
  A reviewer can ask what the tools allow together and how unintended successes are detected.
  That would have exposed a public answer key reachable with web access and code execution, and
  internet access left on for dependency installs. It does not anticipate a route nobody has
  seen, and it does not settle how to score a run that cheated.
severity: high
status: observed_frontier
